:root[data-theme="dark"]{--bg:#151312;--surface:#1f1c1b;--text:#f4efea;--muted:#aaa39b;--line:#34302d;--accent:#ff6b66;--accent-ink:#1a0f0e;--glow:rgba(255,107,102,.18);--dot:#2a2624;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 1.2px,transparent 1.2px) 0 0/22px 22px;color:var(--text);font-family:var(--body);line-height:1.55;min-height:100vh}
main{max-width:1080px;margin:0 auto;padding:28px 24px 72px}
.top{display:flex;justify-content:flex-end;margin-bottom:28px}
.theme{font:inherit;font-weight:500;font-size:.9rem;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.theme:hover{border-color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.3rem,6.5vw,4.4rem);line-height:1;letter-spacing:-.03em;margin:0 0 18px;max-width:14ch}
.lede{max-width:54ch;color:var(--muted);font-size:1.1rem;margin:0 0 34px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:30px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 44px 12px 16px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 .8rem var(--body);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:500;font-size:.9rem;color:var(--text);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;transition:background-color .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:26px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;color:inherit;text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s;animation:rise .5s both}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 70%);opacity:0;transition:opacity .2s;pointer-events:none}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 30px -14px var(--glow)}
.card:hover::before,.card:focus-visible::before{opacity:1}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.icon{width:52px;height:52px;border-radius:14px;background:var(--glow);color:var(--accent);display:grid;place-items:center;transition:transform .25s}
.card:hover .icon{transform:rotate(-8deg) scale(1.08)}
.icon svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag{font-size:.8rem;font-weight:700;color:var(--accent)}
.card h2{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.18;letter-spacing:-.01em;margin:0}
.card p{margin:0;color:var(--muted);font-size:.97rem;flex:1}
.cta{font-weight:700;display:inline-flex;gap:8px;align-items:center;margin-top:4px}
.cta span{display:inline-block;transition:transform .2s;color:var(--accent)}
.card:hover .cta span{transform:translateX(6px)}
.empty{display:none;text-align:center;padding:48px 0;color:var(--muted)}
.empty button{font:inherit;font-weight:700;color:var(--accent);background:none;border:0;text-decoration:underline;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.icon,.cta span{animation:none;transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main>
  <div class="top"><button class="theme" id="theme" type="button">Switch theme</button></div>
  <h1>Learn AI by playing with it</h1>
  <p class="lede">Interactive explorers that make the ideas behind AI applications tangible. Pick a tool, move the sliders, and watch what changes.</p>
  <div class="tools">
    <label class="search"><span class="visually-hidden" style="position:absolute;left:-9999px">Search tools</span>
      <input id="q" type="search" placeholder="Search tools" autocomplete="off"><kbd>/</kbd></label>
    <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No tools match that search. <button type="button" id="reset">Show all tools</button></div>
</main>
<script>
/* ---- EDIT HERE ----
   Set each href to the file or folder of that tool inside this repo.
   Use relative paths (no leading slash) so links work on GitHub Pages
   project sites such as https://username.github.io/repo-name/ */
var TOOLS = [
  { title:'Classification Metrics Explorer', topic:'Machine learning', icon:'bars',
    href:'metrics-explorer-v2 (1).html',
    desc:'See how accuracy, precision, recall and F1 shift as you change the threshold and class balance.' },
  { title:'Classification Model Choice Explorer', topic:'Machine learning', icon:'fork',
    href:'classification-model-choice (6).html',
    desc:'Compare classification models side by side and learn which fits your data and constraints.' },
  { title:'Regression Metrics Explorer', topic:'Machine learning', icon:'trend',
    href:'regression-metrics-lab (3).html',
    desc:'Explore MAE, RMSE and R² and see how outliers and noise change what each one tells you.' },
  { title:'Responsible AI Principles', topic:'Responsible AI', icon:'shield',
    href:'responsible-ai-lab.html',
    desc:'Walk through fairness, transparency, privacy and accountability with practical examples.' },
  { title:'LLM Principles', topic:'LLMs & tools', icon:'chat',
    href:'ai-helpdesk-lab.html',
    desc:'Understand how large language models work, from tokens and context to prompting and limits.' },
  { title:'NGROK Playground', topic:'LLMs & tools', icon:'term',
    href:'ngrok-playground.html',
    desc:'Practice exposing a local app through a public URL so you can demo and test it.' }
];
var ICONS = {
  bars:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  fork:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 8l3.5 8M16.5 8L13 16"/>',
  trend:'<path d="M3 3v18h18"/><circle cx="8" cy="15" r="1"/><circle cx="12" cy="11" r="1"/><circle cx="16" cy="9" r="1"/><circle cx="19" cy="6" r="1"/><path d="M5 17L20 5"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
  term:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>'
};
var grid=document.getElementById('grid'), chips=document.getElementById('chips'),
    q=document.getElementById('q'), empty=document.getElementById('empty'),
    topic='All', cards=[];

TOOLS.forEach(function(t,i){
  var a=document.createElement('a');
  a.className='card'; a.href=t.href; a.style.animationDelay=(i*60)+'ms';
  a.innerHTML='<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[t.icon]+'</svg></span>'+
    '<span class="tag"></span><h2></h2><p></p><span class="cta">Open tool <span aria-hidden="true">&rarr;</span></span>';
  a.querySelector('.tag').textContent=t.topic;
  a.querySelector('h2').textContent=t.title;
  a.querySelector('p').textContent=t.desc;
  a.addEventListener('pointermove',function(e){
    var r=a.getBoundingClientRect();
    a.style.setProperty('--mx',(e.clientX-r.left)+'px');
    a.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
  grid.appendChild(a); cards.push({el:a,t:t});
});

['All'].concat(TOOLS.map(function(t){return t.topic}).filter(function(v,i,s){return s.indexOf(v)===i}))
  .forEach(function(name){
    var b=document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=name;
    b.setAttribute('aria-pressed',name==='All');
    b.addEventListener('click',function(){topic=name;
      [].forEach.call(chips.children,function(c){c.setAttribute('aria-pressed',c===b)});
      apply();});
    chips.appendChild(b);
  });

function apply(){
  var s=q.value.trim().toLowerCase(), n=0;
  cards.forEach(function(c){
    var ok=(topic==='All'||c.t.topic===topic)&&(!s||(c.t.title+' '+c.t.desc+' '+c.t.topic).toLowerCase().indexOf(s)>-1);
    c.el.style.display=ok?'':'none'; if(ok)n++;
  });
  empty.style.display=n?'none':'block';
}
q.addEventListener('input',apply);
document.getElementById('reset').addEventListener('click',function(){q.value='';chips.firstChild.click()});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}
});

var root=document.documentElement, tb=document.getElementById('theme');
try{var saved=localStorage.getItem('theme');if(saved)root.setAttribute('data-theme',saved)}catch(e){}
tb.addEventListener('click',function(){
  var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
  var next=dark?'light':'dark'; root.setAttribute('data-theme',next);
  try{localStorage.setItem('theme',next)}catch(e){}
});
</script>
</body>
</html>
