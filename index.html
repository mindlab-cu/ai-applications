<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside the AI Helpdesk: an interactive LLM lab</title>
<style>
:root{
  --ink:#1C2541; --ink-2:#3A4566; --muted:#5E6886;
  --paper:#EEF1F7; --panel:#FFFFFF; --line:#D5DBE8;
  --cobalt:#2F55D9; --cobalt-soft:#E3E9FC;
  --coral:#E4574B; --coral-soft:#FCE6E3;
  --mint:#1A936A; --mint-soft:#DDF3EA;
  --slab:#E6E9F1;
  --t1:#FFE3A3; --t2:#C8E2FF; --t3:#FFD0DA; --t4:#C9EDD7; --t5:#E2D6FF; --t6:#FFD9BE;
  --tile-edge:rgba(28,37,65,.18);
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --tilefont:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --codefont:ui-monospace,"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;font-size:100%}
html.teacher{font-size:118%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;min-height:100vh}
.rail{background:var(--ink);color:#DCE3F5;padding:22px 16px 24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:1.05rem;line-height:1.25;color:#fff;margin:0 0 4px}
.brand-sub{font-size:.8rem;color:#9AA6C6;margin:0 0 22px}
.track{position:relative;list-style:none;margin:0;padding:0}
.track::before{content:"";position:absolute;left:13px;top:10px;bottom:10px;width:2px;background:#36426A}
.stop{position:relative}
.stop button{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:0;text-align:left;padding:7px 6px;border-radius:10px;cursor:pointer;color:inherit}
.stop button:hover{background:#26315A}
.stop[aria-current="step"] button{background:#2B3870}
.dot{flex:0 0 16px;height:16px;margin:3px 0 0 6px;border-radius:50%;background:var(--ink);border:2px solid #5B6894;position:relative;z-index:1}
.stop.done .dot{background:var(--mint);border-color:var(--mint)}
.stop[aria-current="step"] .dot{border-color:#fff;background:var(--cobalt);box-shadow:0 0 0 4px rgba(47,85,217,.35)}
.stop-text{display:flex;flex-direction:column;min-width:0}
.stop-name{font-size:.92rem;font-weight:600;color:#fff}
.stop-nick{font-size:.76rem;color:#9AA6C6}
.stop.soon .stop-name{color:#B8C2DD;font-weight:500}
.packet{position:absolute;left:-2px;width:32px;height:24px;border-radius:6px;background:var(--t1);color:var(--ink);font:700 .78rem/24px var(--tilefont);text-align:center;box-shadow:0 2px 0 var(--tile-edge);transition:top .55s cubic-bezier(.5,1.6,.4,1);z-index:2;pointer-events:none;transform:translateX(-40px)}
.rail-foot{margin-top:22px;padding-top:16px;border-top:1px solid #36426A;font-size:.8rem;color:#9AA6C6}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:8px;color:#DCE3F5}
.toggle input{width:18px;height:18px;accent-color:var(--cobalt)}
.linkbtn{background:none;border:0;color:#9AA6C6;text-decoration:underline;cursor:pointer;padding:0;margin-top:10px;font-size:.8rem}

main{padding:28px 32px 48px;min-width:0}
.question{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-size:.88rem;color:var(--ink-2);margin-bottom:18px;max-width:100%}
.question b{background:var(--t1);border-radius:999px;padding:2px 10px;font-weight:700;color:var(--ink);white-space:nowrap}
.question span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.st-num{font-size:.85rem;color:var(--muted);margin:0 0 6px}
h1.title{margin:0;display:flex;flex-wrap:wrap;gap:6px;font-family:var(--tilefont);font-weight:800;font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.05;letter-spacing:-.01em}
h1.title .tpart{background:var(--t1);padding:.08em .22em .12em;border-radius:.18em;box-shadow:0 .08em 0 var(--tile-edge)}
h1.title .tpart:nth-child(2){background:var(--t2)}
h1.title .tpart:nth-child(3){background:var(--t3)}
.lede{max-width:64ch;color:var(--ink-2);margin:12px 0 22px;font-size:1.02rem}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--mint-soft);color:var(--mint);font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:999px}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab .step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--slab);font-size:.75rem;color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cobalt)}
.tab[aria-selected="true"] .step{background:var(--cobalt);color:#fff}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:1.1rem;margin:0 0 6px}
.card h3{font-size:1rem;margin:0 0 6px}
.card p{margin:0 0 10px;max-width:70ch}
.hint{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:650;cursor:pointer;background:var(--slab);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--cobalt);color:#fff}
.btn.danger{background:var(--coral);color:#fff}
.btn.ghost{background:none;border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--cobalt)}
.seg{display:inline-flex;background:var(--slab);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(28,37,65,.15)}
.textin{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.1rem;background:#FBFCFE;resize:vertical;min-height:54px}
.textin:focus{border-color:var(--cobalt);outline:none}
label.lbl{display:block;font-weight:650;font-size:.9rem;margin-bottom:6px}

/* ---------- tiles ---------- */
.strip{position:relative;display:flex;flex-wrap:wrap;align-items:center;min-height:64px;padding:14px 10px;background:#F7F8FC;border:1.5px dashed var(--line);border-radius:12px;overflow:hidden}
.strip.empty{color:var(--muted);justify-content:center;font-size:.95rem}
.tile{display:inline-flex;align-items:center;font:700 1.15rem/1 var(--tilefont);padding:9px 10px 10px;margin:5px 3px;border-radius:8px;box-shadow:0 2px 0 var(--tile-edge);white-space:pre;transition:margin .45s ease, border-radius .45s ease, background-color .45s ease, transform .3s ease, box-shadow .3s}
.tile .sp{color:rgba(28,37,65,.38);font-weight:400;margin-right:1px}
.c0{background:var(--t1)}.c1{background:var(--t2)}.c2{background:var(--t3)}.c3{background:var(--t4)}.c4{background:var(--t5)}.c5{background:var(--t6)}
.strip.joined .tile{margin:5px 0;border-radius:0;background:var(--slab);box-shadow:none}
.strip.joined .tile:first-child{border-radius:8px 0 0 8px}
.strip.joined .tile:last-child{border-radius:0 8px 8px 0}
.tile.hl{background:var(--cobalt)!important;color:#fff;transform:translateY(-4px)}
.tile.hl .sp{color:rgba(255,255,255,.7)}
.tile.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.blade{position:absolute;top:0;bottom:0;width:4px;left:-8px;background:var(--coral);box-shadow:0 0 14px 3px rgba(228,87,75,.55);border-radius:4px}
.blade.go{animation:sweep .7s ease-in-out forwards}
@keyframes sweep{from{left:-8px}to{left:calc(100% + 8px)}}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.stat{background:#F7F8FC;border-radius:12px;padding:12px 14px}
.stat .v{font:800 1.7rem/1.1 var(--tilefont)}
.stat .k{font-size:.82rem;color:var(--muted)}

.merge-box{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;margin-top:14px}
.rule{background:var(--cobalt-soft);border-radius:12px;padding:14px 16px;min-height:96px}
.rule .big{font:800 1.3rem/1.3 var(--tilefont);margin:4px 0}
.rule code,.mono{font-family:var(--codefont);font-size:.9em;background:rgba(255,255,255,.7);padding:1px 6px;border-radius:5px}
.rulelog{list-style:none;margin:0;padding:0;max-height:160px;overflow:auto;font-size:.85rem}
.rulelog li{padding:4px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.rulelog li span:last-child{color:var(--muted)}

/* ---------- challenge ---------- */
.dots{display:flex;gap:6px}
.dots i{width:28px;height:6px;border-radius:3px;background:var(--slab)}
.dots i.on{background:var(--cobalt)}.dots i.good{background:var(--mint)}.dots i.mid{background:#E9B23E}.dots i.bad{background:var(--coral)}
.cutword{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;padding:26px 8px 18px;user-select:none}
.letter{font:800 2.2rem/1 var(--tilefont);padding:14px 4px;min-width:30px;text-align:center;background:var(--t1);box-shadow:0 3px 0 var(--tile-edge)}
.letter.first{border-radius:10px 0 0 10px;padding-left:12px}
.letter.last{border-radius:0 10px 10px 0;padding-right:12px}
.gap{position:relative;width:18px;border:0;background:var(--t1);box-shadow:0 3px 0 var(--tile-edge);cursor:pointer;padding:0}
.gap::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:2px;transform:translateX(-50%);background:rgba(28,37,65,.12)}
.gap:hover::after{background:var(--coral);opacity:.55}
.gap[aria-pressed="true"]{background:transparent;box-shadow:none;width:26px}
.gap[aria-pressed="true"]::after{background:var(--coral);width:3px;top:-6px;bottom:-6px}
.gap[aria-pressed="true"]::before{content:"✂";position:absolute;top:-24px;left:50%;transform:translateX(-50%);color:var(--coral);font-size:1rem}
.gap[aria-pressed="true"] + .letter{border-radius:10px 0 0 10px}
.letter.before-cut{border-radius:0 10px 10px 0}
.letter.first.before-cut{border-radius:10px}
.compare{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;align-items:center;margin-top:10px}
.compare .who{font-weight:650;font-size:.9rem;color:var(--muted)}
.score{font:800 2rem/1 var(--tilefont)}
.verdict{display:flex;gap:14px;align-items:center;margin:12px 0}

/* ---------- architecture ---------- */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:8px 0 18px;overflow-x:auto;padding:4px 2px 8px}
.node{position:relative;border:2px solid var(--line);border-radius:12px;padding:12px;background:#F7F8FC;transition:border-color .3s, background .3s, transform .3s;min-height:96px}
.node .nn{font-size:.75rem;color:var(--muted)}
.node .nt{font-weight:700;margin:2px 0 4px;font-size:.88rem;hyphens:auto;overflow-wrap:break-word}
.node .nd{font-size:.8rem;color:var(--ink-2);line-height:1.35}
.node.active{border-color:var(--cobalt);background:var(--cobalt-soft);transform:translateY(-3px)}
.node.passed{border-color:var(--mint);background:var(--mint-soft)}
.node:not(:last-child)::after{content:"";position:absolute;right:-10px;top:50%;width:10px;height:2px;background:var(--line)}
.node.passed:not(:last-child)::after{background:var(--mint)}
.stage-out{min-height:120px}
.chunks{display:flex;flex-wrap:wrap;gap:6px}
.chunk{font-family:var(--codefont);background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:3px 8px;white-space:pre}
.handoff{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:12px;padding:14px 18px}
.handoff p{margin:0;color:#DCE3F5}

/* ---------- real world ---------- */
.rw-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.rw-grid .card{margin:0}
.bars{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bar{display:grid;grid-template-columns:90px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.88rem}
.bar .track2{background:var(--slab);border-radius:6px;height:22px;overflow:hidden}
.bar .fill{height:100%;background:var(--cobalt);border-radius:6px;width:0;transition:width .7s ease}
.bar b{text-align:right}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fact .v{font:800 1.5rem/1.1 var(--tilefont)}
.fact .k{font-size:.84rem;color:var(--ink-2)}

/* ---------- narrator ---------- */
.narrator{background:var(--panel);border-left:1px solid var(--line);padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.narrator h2{font-size:.95rem;margin:0 0 2px}
.narrator .sub{font-size:.8rem;color:var(--muted);margin:0 0 14px}
.feed{display:flex;flex-direction:column;gap:10px}
.msg{border-radius:12px;padding:12px 14px;background:#F4F6FB;font-size:.92rem;border-left:4px solid var(--line)}
.msg.new{animation:slidein .35s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.msg.info{border-left-color:var(--cobalt)}
.msg.good{border-left-color:var(--mint);background:var(--mint-soft)}
.msg.warn{border-left-color:var(--coral);background:var(--coral-soft)}
.msg .mt{font-weight:700;margin-bottom:3px}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg.old{opacity:.6}

.gsec{margin-bottom:18px}
.gsec h3{font-size:.85rem;color:var(--muted);font-weight:650;margin:0 0 8px}
.msg ul{margin:0;padding-left:18px}
.msg li{margin:0 0 6px}
.msg li:last-child{margin:0}
.msg.page{background:#EEF2FD;color:var(--ink);border-left-color:var(--cobalt)}
.msg.page .mt{color:var(--ink)}
.msg.idle{color:var(--muted)}
.soon-wrap{max-width:70ch}
/* ---------- walkthrough ---------- */
.wsteps{list-style:none;margin:0 0 16px;padding:0;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.wpill{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px 5px 5px;font-size:.85rem;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.wpill .wn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--slab);font-size:.78rem}
.wpill.ok .wn{background:var(--mint);color:#fff}
.wpill.cur{border-color:var(--cobalt);color:var(--ink)}
.wpill.cur .wn{background:var(--cobalt);color:#fff}
.wpill:disabled{opacity:.45;cursor:not-allowed}
.wcard{padding:26px 28px}
.wnum{margin:0 0 4px;font-size:.85rem;color:var(--cobalt);font-weight:700}
.wtitle{font-size:1.45rem!important;margin:0 0 10px!important;line-height:1.25}
.wtext{font-size:1.05rem;max-width:66ch}
.wtext p{margin:0 0 10px}
.wstage{margin-top:16px}
.wact{margin-top:14px}
.keyidea{display:flex;gap:12px;align-items:flex-start;margin-top:18px;background:var(--t1);border-radius:12px;padding:14px 16px;font-size:1.02rem}
.keyidea .kl{flex:0 0 auto;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;margin-top:2px}
.wnav{display:flex;align-items:center;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.wnav #wHint{flex:1;text-align:center}
.wnav #wNext{margin-left:auto}
.slabtile{background:var(--slab)!important;box-shadow:none;font-weight:600}
.tile.bad{outline:3px solid var(--coral);outline-offset:1px;background:var(--coral-soft)!important}
.sentence{font-size:1.25rem;margin:14px 0;line-height:1.6}
.blank{display:inline-block;min-width:80px;border-bottom:3px dashed var(--cobalt);text-align:center;font-weight:700;color:var(--cobalt)}
.pred{background:var(--t1);padding:2px 8px;border-radius:6px}
.opts.row{display:flex;flex-wrap:wrap}
.opts.row .opt{min-width:120px;text-align:center}
.ex-list{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chunk.pop{animation:pop .45s ease}
.formula{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-family:var(--codefont);font-size:.95rem}
.bar.hl .fill{background:var(--mint)}
.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:pre}
.wheel-row{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-top:10px}
.wheel{position:relative;width:240px;height:240px;flex:0 0 auto}
.wheel svg{width:100%;height:100%;display:block}
.wheel .wg{transform-origin:center;transform-box:fill-box}
.wheel .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);color:var(--coral);font-size:1.5rem;z-index:1;line-height:1}
.gw{display:inline-block}
.gen{color:var(--cobalt);font-weight:700}
.layers{display:flex;flex-direction:column;gap:6px;max-width:420px;margin-top:10px}
.layer{border:2px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;display:flex;justify-content:space-between;background:#F7F8FC;transition:all .3s}
.layer span{font-weight:500;color:var(--muted);font-size:.85rem}
.layer.on{border-color:var(--cobalt);background:var(--cobalt-soft)}
/* ---------- station 4 ---------- */
.map-row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.mapbox{flex:0 1 420px;min-width:260px;max-width:440px;background:#FBFCFE;border:1.5px solid var(--line);border-radius:14px;padding:6px}
.mapbox.big{flex-basis:480px;max-width:520px}
.mmap{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.mmap .grid line{stroke:#E3E7F0}
.mmap .grid text{font-size:11px;fill:var(--muted)}
.mmap .axis{stroke:var(--ink-2);stroke-width:2}
.mmap .axl{font-size:14px;font-weight:700;fill:var(--ink-2)}
.mmap .wl{font-size:16px;font-weight:800;font-family:var(--tilefont)}
.mmap .dotl{font-size:12px;fill:var(--muted);font-style:italic}
.mmap .segl{font-size:14px;font-weight:800}
.mmap .arcl{font-size:15px;font-weight:800;fill:#8A6510}
.mmap .mw{cursor:pointer;outline:none}
.mmap .mw.drag{cursor:grab}
.mmap .mw.drag:active{cursor:grabbing}
.mmap .mw:focus-visible circle{stroke:var(--ink);stroke-width:3}
.mmap .mw.sel circle{stroke:var(--t1);stroke-width:4}
.mmap .mw.faded{opacity:.3}
.calc{background:#F7F8FC;border-radius:12px;padding:12px 16px;min-height:60px}
.calc .cl{font-family:var(--codefont);font-size:.95rem;padding:6px 0;border-bottom:1px dashed var(--line);white-space:pre-wrap}
.calc .cl:last-child{border-bottom:0}
.calc .cl.pop{animation:slidein .35s ease}
.simscale{display:grid;grid-template-columns:130px minmax(0,1fr) 54px;gap:10px;align-items:center;margin-top:10px;font-size:.92rem}
.sbar{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,#E9ECF3,#BFD0FA 60%,var(--mint))}
.sbar i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .5s ease}
.simscale b{text-align:right;font-family:var(--codefont)}
.cellrow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:center;margin:8px 0}
.cells{display:grid;grid-template-columns:repeat(32,minmax(6px,1fr));gap:2px}
.cells span{height:26px;border-radius:3px;background:#eee}
.vdb .cells{grid-template-columns:repeat(6,28px)}

<body>
<div class="app">
  <nav class="rail" aria-label="Lab stations">
    <p class="brand">Inside the AI Helpdesk</p>
    <p class="brand-sub">Follow one question through every part of a real AI assistant.</p>
    <ol class="track" id="track"></ol>
    <div class="rail-foot">
      <label class="toggle"><input type="checkbox" id="teacher"> Projector mode (larger text)</label>
      <button class="linkbtn" id="resetProgress">Reset my progress</button>
    </div>
  </nav>

  <main id="main">
    <div class="question" title="This question travels through every station"><b>Student asks</b><span id="qtext">What is the minimum attendance required?</span></div>
    <div class="st-head">
      <div>
        <p class="st-num" id="stNum"></p>

      </div>

    </div>

    <div class="tabs" role="tablist" id="tabs"></div>
    <section id="panel" role="tabpanel"></section>
  </main>

  <aside class="narrator" aria-label="Lab guide">
    <h2>Lab guide</h2>
    <p class="sub">Explains the page you are on and your last action.</p>
    <div class="gsec"><h3>On this page</h3><div id="gPage"></div></div>
    <div class="gsec"><h3>What just happened</h3><div id="gNow" aria-live="polite"></div></div>
  </aside>
</div>

<script>
"use strict";
/* =========================================================
   Shared utilities
   ========================================================= */
const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));
const QUESTION = "What is the minimum attendance required?";

const store = {
  key:'ai-helpdesk-lab-v1',
  data:{done:{}, scores:{}},
  load(){ try{ const raw = localStorage.getItem(this.key); if(raw) this.data = Object.assign({done:{},scores:{}}, JSON.parse(raw)); }catch(e){} },
  save(){ try{ localStorage.setItem(this.key, JSON.stringify(this.data)); }catch(e){} }
};

/* ---------- Narrator ---------- */
const Narrator = {
  list(points){ return `<ul>${(Array.isArray(points)?points:[points]).filter(Boolean).map(p=>`<li>${p}</li>`).join('')}</ul>`; },
  page(title, points, idle='Nothing yet. Try something on the page.'){
    $('#gPage').innerHTML = `<div class="msg page"><div class="mt">${title}</div>${this.list(points)}</div>`;
    this.idle(idle);
  },
  idle(text){ $('#gNow').innerHTML = `<div class="msg idle">${text}</div>`; },
  say(title, points, tone='info'){
    $('#gNow').innerHTML = `<div class="msg ${tone} new"><div class="mt">${title}</div>${this.list(points)}</div>`;
  }
};

/* =========================================================
   Tokenizer engine (a real, small BPE trained in the browser)
   ========================================================= */
const CORPUS = `Students must maintain at least seventy five percent attendance. The attendance policy applies to every student in every course. Students who miss classes should inform the department. The examination schedule is shared with all students before the term starts. Attendance is recorded in each lecture and each lab. The university expects students to attend lectures, labs and tutorials. Students can check their attendance on the portal. Low attendance means a student cannot sit the final examination. What is the minimum attendance required? The minimum attendance required is seventy five percent.
The teacher explained artificial intelligence in simple language. Artificial intelligence helps computers learn from data. A language model reads text as tokens. Tokens are small pieces of text. The tokenizer splits text into tokens before the model reads it. Tokenization is the first step. The model is trained on a large amount of text. Training teaches the model to predict the next token. Students are learning about tokens, training and prediction. Learning is interesting and thinking is important. The students were thinking, reading, writing and speaking. Reading and writing are useful skills. I love artificial intelligence.
The result was unbelievable and the answer was unexpected. It was unclear, unusual and unfair. Unlike before, the students were unable to finish. The book is readable, the plan is reasonable and the goal is achievable. The answer is believable and the task is manageable. The seat is comfortable and the room is available. Information, education, communication and organization are common words. The nation needs innovation, creation and imagination. Students will rewrite, redo and rethink their work. They return, review and repeat the lesson. The government announced new development and improvement. Management, assessment and enrollment are part of the process.
The department of computer science teaches programming. Computers, computing and computation are related. The chat assistant can answer questions. People chat with the assistant every day. The year is 2026 and the course started in 2025. In 2024 there were 120 students and in 2026 there are 150 students. Each answer is checked. The questions are required for the exam. Is the lab required? The minimum marks are required to pass.
I believe the students believed the result. We believe in learning. Their belief was strong and the story was believable. We love learning and we love our lovely campus. Students love the lab. They were loving the lesson and they loved the projects.
The students were working, testing, building and thinking about the problem. The teacher was helping, explaining and checking. Think again and rethink the idea. Read the notes and reread the chapter. Being unable to attend is unacceptable.`;
const Tok = (() => {
  const PRE = /\s?[\p{L}\p{M}]+|\s?\p{N}{1,3}|\s?[^\s\p{L}\p{M}\p{N}]+|\s+/gu;
  const SEP = '\u0000';
  const pretok = t => t.match(PRE) || [];
  const words = pretok(CORPUS.replace(/\s+/g,' '));
  const corpusWordCount = CORPUS.split(/\s+/).filter(Boolean).length;

  // Train: repeatedly merge the most frequent neighbouring pair.
  const freq = new Map();
  for(const w of words) freq.set(w, (freq.get(w)||0)+1);
  const work = [...freq].map(([w,f]) => ({s:Array.from(w), f}));
  const baseChars = new Set(); work.forEach(w => w.s.forEach(c => baseChars.add(c)));
  const merges = [];
  for(let m=0; m<600; m++){
    const pc = new Map();
    for(const {s,f} of work) for(let i=0;i<s.length-1;i++){ const k=s[i]+SEP+s[i+1]; pc.set(k,(pc.get(k)||0)+f); }
    let best=null, bc=0; for(const [k,c] of pc) if(c>bc){bc=c;best=k;}
    if(!best || bc<2) break;
    const [a,b] = best.split(SEP); merges.push({a,b,count:bc});
    for(const w of work){ const s=w.s,o=[]; for(let i=0;i<s.length;i++){ if(i<s.length-1&&s[i]===a&&s[i+1]===b){o.push(a+b);i++;} else o.push(s[i]); } w.s=o; }
  }
  const rank = new Map(merges.map((m,i)=>[m.a+SEP+m.b,i]));
  const pieces = new Set(merges.map(m=>m.a+m.b));

  function mergeOnce(s, a, b){ const o=[]; for(let i=0;i<s.length;i++){ if(i<s.length-1&&s[i]===a&&s[i+1]===b){o.push(a+b);i++;} else o.push(s[i]); } return o; }
  function bestPair(s, maxR=Infinity){ let br=Infinity, bi=-1; for(let i=0;i<s.length-1;i++){ const r=rank.get(s[i]+SEP+s[i+1]); if(r!==undefined && r<maxR && r<br){br=r;bi=i;} } return bi<0?null:{i:bi,r:br}; }
  function encodeWord(w, maxR=Infinity){ let s=Array.from(w); for(;;){ const p=bestPair(s, maxR); if(!p) break; s=mergeOnce(s,s[p.i],s[p.i+1]); } return s; }

  return {
    merges, rank, pieces, baseChars, corpusWordCount, pretok,
    vocabSize: baseChars.size + merges.length,
    spaces: t => t.split(/\s+/).filter(Boolean),
    chars: t => Array.from(t),
    bpe: (t, maxR=Infinity) => pretok(t).flatMap(w => encodeWord(w, maxR)),
    encodeWord,
    // Step-by-step merging across a whole sentence (same result as bpe()).
    stepper(text){
      let ws = pretok(text).map(w => Array.from(w));
      return {
        tokens(){ return ws.flat(); },
        words(){ return ws; },
        peek(){ let best=null; ws.forEach((s,wi)=>{ const p=bestPair(s); if(p && (!best || p.r<best.r)) best={...p,wi}; }); return best; },
        apply(r){ const {a,b}=merges[r]; ws = ws.map(s=>mergeOnce(s,a,b)); }
      };
    },
    countInCorpus(piece){ let n=0; for(const [w,f] of freq) if(w.includes(piece)) n+=f; return n; },
    isKnownPiece(p){ return p.length===1 || pieces.has(p); }
  };
})();

/* ---------- Tile rendering ---------- */
function tileHTML(tok, i, extra=''){
  const lead = tok.startsWith(' ');
  const body = lead ? tok.slice(1) : tok;
  const shown = body === '' ? '' : esc(body);
  return `<span class="tile c${i%6} ${extra}" data-i="${i}">${lead?'<span class="sp" aria-hidden="true">␣</span>':''}${shown || (lead?'':'&nbsp;')}</span>`;
}
const showTok = t => esc(t).replace(/ /g,'␣');

/* =========================================================
   Station registry
   ========================================================= */
const TABS = [
  {id:'explore', label:'Learn step by step'},
  {id:'challenge', label:'Challenge'},
  {id:'architecture', label:'Reveal the architecture'},
  {id:'realworld', label:'Real world'}
];

const STATIONS = [
  {n:1, name:'Tokenization', nick:'The Slicer', parts:['Token','ization'],
   lede:'Before a model can read anything, the text is cut into small pieces called tokens. Follow the steps to find out how.',
   build: null /* set below */},
  {n:2, name:'Token IDs', nick:'The Locker Room', parts:['Token',' IDs'], soon:'Every token gets a locker number in the vocabulary. You will see unknown words, discover that IDs carry no meaning, and watch an ID select a row of the embedding table.'},
  {n:3, name:'Next-word prediction', nick:'Be the Model', parts:['Next','-word',' prediction'], soon:'Grow word counts from a corpus, turn them into probabilities, spin a sampling wheel with temperature, then peek inside a simplified transformer.'},
  {n:4, name:'Embeddings', nick:'Meaning Map', parts:['Embed','dings'], soon:'Drag words around a map of meaning and watch cosine similarity change as the angle between arrows.'},
  {n:5, name:'Prompts', nick:'Prompt Builder', parts:['Prom','pts'], soon:'Snap system and user blocks together, and see the raw chat template the model actually receives.'},
  {n:6, name:'Conversation history', nick:'The Forgetful Genius', parts:['Convers','ation',' history'], soon:'Discover that the model forgets everything between turns, and manage a context window that overflows.'},
  {n:7, name:'RAG', nick:'Wire the Librarian', parts:['R','AG'], soon:'Wire documents, chunker, embedder, vector store and retriever into a working pipeline that finds the attendance rule.'},
  {n:8, name:'Tool use', nick:'Rules vs. Reasoning', parts:['Tool',' use'], soon:'Compare a keyword rule with real function calling, and fill in tool arguments yourself.'},
  {n:9, name:'Single agent', nick:'The Loop', parts:['Single',' agent'], soon:'Step through the Think, Act, Observe loop and stop an agent that gets stuck.'},
  {n:10, name:'Multiple agents', nick:'Assemble the Team', parts:['Multi','-agent'], soon:'Build a team of researcher, calculator, writer and reviewer agents and watch messages flow between them.'},
  {n:11, name:'Build the whole bot', nick:'Capstone', parts:['Cap','stone'], soon:'Assemble every component into the full College Helpdesk Bot and run the student’s question end to end.'}
];

let current = 1, currentTab = 'explore';
const shared = { text: QUESTION, mode:'bpe' };  // state that survives tab switches

/* =========================================================
   Shell
   ========================================================= */
function renderRail(){
  const track = $('#track');
  track.innerHTML = STATIONS.map(s => `
    <li class="stop ${store.data.done[s.n]?'done':''} ${s.build?'':'soon'}" data-n="${s.n}" ${s.n===current?'aria-current="step"':''}>
      <button type="button" aria-label="Station ${s.n}: ${esc(s.name)}${s.build?'':' (coming soon)'}">
        <span class="dot"></span>
        <span class="stop-text"><span class="stop-name">${s.n<11?s.n+'. ':''}${esc(s.name)}</span><span class="stop-nick">${esc(s.nick)}${s.build?'':' · coming soon'}</span></span>
      </button>
    </li>`).join('');
  track.querySelectorAll('.stop button').forEach(b => b.addEventListener('click', () => go(+b.parentElement.dataset.n)));
  requestAnimationFrame(movePacket);
}
function movePacket(){
  const li = $(`.stop[data-n="${current}"]`); const pk = $('#packet');
  if(li && pk){ pk.style.top = (li.offsetTop + 6) + 'px'; }
}

function go(n, tab='explore'){
  current = n; currentTab = tab;
  const s = STATIONS.find(x=>x.n===n);
  $('#stNum').textContent = n<11 ? `Station ${n} of 10 · ${s.nick}` : s.nick;
  $('#stTitle').innerHTML = s.parts.map(p=>`<span class="tpart">${esc(p.trim())}</span>`).join('');
  $('#stLede').textContent = s.build ? s.lede : s.soon;
  $('#stBadge').innerHTML = store.data.done[n] ? `<span class="badge">✓ Station complete</span>` : '';
  document.querySelectorAll('.stop').forEach(li => li.removeAttribute('aria-current'));
  document.querySelectorAll('.stop').forEach(li => { if(+li.dataset.n===n) li.setAttribute('aria-current','step'); });
  movePacket();
  if(!s.build){
    $('#tabs').innerHTML='';
    $('#panel').innerHTML = `<div class="card soon-wrap"><h2>This station is being built next</h2>
      <p>${esc(s.soon)}</p><p class="hint">Every station follows the same four steps: explore freely, take the challenge, reveal the real architecture, then see how production AI systems do it.</p>
      <button class="btn primary" id="backTo1">Go to Station 1</button></div>`;
    $('#backTo1').onclick = () => go(1);
    Narrator.page(`Station ${n}: ${esc(s.name)}`, [`This station is not built yet.`, `It will teach: ${esc(s.soon)}`, `Station 1 is ready to play now.`], 'Use the button on the page to go back to Station 1.');
    return;
  }
  renderTabs(s);
}

function renderTabs(s){
  $('#tabs').innerHTML = TABS.map((t,i)=>`<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${t.id===currentTab}" data-t="${t.id}"><span class="step">${i+1}</span>${t.label}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { currentTab=b.dataset.t; renderTabs(s); });
  const panel = $('#panel'); panel.innerHTML=''; panel.setAttribute('aria-labelledby','tab-'+currentTab);
  s.build[currentTab](panel);
}

function completeStation(n){
  if(!store.data.done[n]){ store.data.done[n]=true; store.save(); }
  $('#stBadge').innerHTML = `<span class="badge">✓ Station complete</span>`;
  renderRail();
}

/* =========================================================
   Station 1 — Tokenization
   ========================================================= */
const PRESETS = [
  {label:'The student’s question', text:QUESTION},
  {label:'From the PDF', text:'I love artificial intelligence'},
  {label:'A long word', text:'Tokenization is unbelievable'},
  {label:'strawberry', text:'How many r letters are in strawberry?'},
  {label:'Hindi', text:'न्यूनतम उपस्थिति कितनी होनी चाहिए?'},
  {label:'Punjabi', text:'ਘੱਟੋ-ਘੱਟ ਹਾਜ਼ਰੀ ਕਿੰਨੀ ਚਾਹੀਦੀ ਹੈ?'},
  {label:'Some code', text:'print("Hello, student!")'}
];
const MODES = {
  spaces:{label:'Split on spaces', fn:Tok.spaces},
  chars:{label:'Every character', fn:Tok.chars},
  bpe:{label:'Subword (BPE)', fn:Tok.bpe}
};
const hasNonLatin = t => /[^\u0000-\u024F\s]/.test(t);

const S1 = {};
STATIONS[0].build = S1;

S1.sandbox = (panel) => {
  panel.innerHTML = `
  <div class="card">
    <label class="lbl" for="s1text">Text to slice</label>
    <textarea class="textin" id="s1text" rows="1" spellcheck="false">${esc(shared.text)}</textarea>
    <div class="row" style="margin-top:10px" id="s1presets">${PRESETS.map((p,i)=>`<button class="chip" data-i="${i}">${esc(p.label)}</button>`).join('')}</div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><div class="lbl" id="s1modeLbl">Choose how to cut</div>
        <div class="seg" role="group" aria-labelledby="s1modeLbl" id="s1modes">${Object.entries(MODES).map(([k,m])=>`<button data-m="${k}" aria-pressed="${k===shared.mode}">${m.label}</button>`).join('')}</div>
      </div>
      <button class="btn danger" id="s1slice">✂ Slice it</button>
    </div>
    <div style="margin-top:16px"><div class="strip empty" id="s1strip">Press “Slice it” to cut the text into tokens.</div></div>
    <div class="stats">
      <div class="stat"><div class="v" id="s1chars">–</div><div class="k">characters</div></div>
      <div class="stat"><div class="v" id="s1toks">–</div><div class="k">tokens</div></div>
      <div class="stat"><div class="v" id="s1ratio">–</div><div class="k">characters per token</div></div>
    </div>
  </div>
  <div class="card" id="s1mergeCard">
    <h2>Watch the subword tokenizer work</h2>
    <p class="hint">Start from single characters. Each step glues together one pair that the tokenizer learned during training. Pairs that appeared often in its ${Tok.corpusWordCount}-word training text were learned first.</p>
    <div class="row">
      <button class="btn primary" id="mStart">Start from characters</button>
      <button class="btn" id="mStep" disabled>Merge next pair</button>
      <button class="btn" id="mPlay" disabled>▶ Play</button>
      <button class="btn ghost" id="mEnd" disabled>Skip to the end</button>
    </div>
    <div style="margin-top:14px"><div class="strip empty" id="mStrip">The merge playback will appear here.</div></div>
    <div class="merge-box">
      <div class="rule" id="mRule"><div class="hint">The rule being applied will show here.</div></div>
      <div><div class="lbl">Rules applied so far</div><ul class="rulelog" id="mLog"></ul></div>
    </div>
  </div>`;

  const ta = $('#s1text');
  ta.addEventListener('input', () => { shared.text = ta.value; });
  $('#s1presets').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    shared.text = PRESETS[+b.dataset.i].text; ta.value = shared.text; slice();
  });
  $('#s1modes').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    shared.mode = b.dataset.m;
    $('#s1modes').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    slice();
  });
  $('#s1slice').onclick = slice;

  let busy = false;
  async function slice(){
    if(busy) return; busy = true;
    const text = shared.text;
    const strip = $('#s1strip');
    if(!text.trim()){ strip.className='strip empty'; strip.textContent='Type something to slice first.'; busy=false; return; }
    const toks = MODES[shared.mode].fn(text);
    strip.className = 'strip joined';
    strip.innerHTML = toks.map((t,i)=>tileHTML(shared.mode==='spaces' && i>0 ? t : t, i)).join('') + `<span class="blade"></span>`;
    await wait(60);
    strip.querySelector('.blade').classList.add('go');
    await wait(560);
    strip.classList.remove('joined');
    await wait(500);
    const blade = strip.querySelector('.blade'); if(blade) blade.remove();
    const chars = Array.from(text).length;
    $('#s1chars').textContent = chars;
    $('#s1toks').textContent = toks.length;
    $('#s1ratio').textContent = (chars/toks.length).toFixed(1);
    explain(text, toks);
    busy = false;
  }

  function explain(text, toks){
    const m = shared.mode;
    if(m==='spaces'){
      const glued = toks.filter(t => /[^\p{L}\p{M}\p{N}]/u.test(t) && /[\p{L}\p{N}]/u.test(t));
      Narrator.say('You split on spaces', [
        `You cut only where there was a space, like <span class="mono">text.split()</span> in the lab code.`,
        `Result: <b>${toks.length} tokens</b>.`,
        glued.length ? `Punctuation stayed stuck to words: <b>${glued.map(esc).join(', ')}</b>.` : '',
        glued.length ? `So “required?” and “required” become two different tokens.` : '',
        `Problem: a word never seen in training would have no token at all.`,
        `Next: try <b>Every character</b>.`]);
    } else if(m==='chars'){
      Narrator.say('You split into characters', [
        `Result: <b>${toks.length} tokens</b>, one per character, spaces included.`,
        `Good: no word is ever unknown.`,
        `Bad: the sequence gets long, so the model is slower and costs more.`,
        `Bad: one letter on its own carries almost no meaning.`,
        `Next: try <b>Subword (BPE)</b>.`]);
    } else {
      const words = Tok.pretok(text).filter(w=>/[\p{L}\p{N}]/u.test(w));
      const whole = words.filter(w => Tok.encodeWord(w).length===1).map(w=>w.trim());
      const split = words.filter(w => Tok.encodeWord(w).length>1);
      const nl = hasNonLatin(text);
      Narrator.say('You used subword (BPE)', [
        `This is how ChatGPT, Claude and Llama cut text.`,
        `Result: <b>${toks.length} tokens</b>.`,
        whole.length ? `Kept whole, because they were common in training: <b>${whole.slice(0,6).map(esc).join(', ')}</b>${whole.length>6?'…':''}.` : '',
        split.length ? `Built from pieces: <b>${esc(split[0].trim())}</b> → ${Tok.encodeWord(split[0]).map(p=>`<span class="mono">${showTok(p)}</span>`).join(' ')}.` : '',
        `<span class="mono">␣</span> means the token includes the space before the word.`,
        nl ? `This toy tokenizer learned only English, so this script falls back to single characters.` : '',
        nl ? `The <b>Real world</b> tab shows what this costs.` : ''], 'good');
    }
  }

  /* ---- merge playback ---- */
  let st=null, timer=null, applied=0;
  const mStrip=$('#mStrip'), mRule=$('#mRule'), mLog=$('#mLog');
  const setBtns = (running) => { $('#mStep').disabled = !st || running; $('#mPlay').disabled = !st; $('#mEnd').disabled = !st || running; };
  function draw(hl=null, popIdx=null){
    const ws = st.words(); let i=0; let html='';
    ws.forEach((s,wi) => s.forEach((t,ti) => {
      const isHl = hl && hl.wi===wi && (ti===hl.i || ti===hl.i+1);
      html += tileHTML(t, i, (isHl?'hl ':'') + (popIdx && popIdx.has(t)?'pop':'')); i++;
    }));
    mStrip.className='strip'; mStrip.innerHTML = html;
  }
  function stop(){ clearInterval(timer); timer=null; $('#mPlay').textContent='▶ Play'; setBtns(false); }
  async function stepOnce(){
    const p = st.peek();
    if(!p){ finish(); return false; }
    const m = Tok.merges[p.r];
    // highlight every occurrence of this pair
    draw({wi:p.wi, i:p.i});
    mRule.innerHTML = `<div class="hint">Rule ${p.r+1} of ${Tok.merges.length}</div>
      <div class="big"><span class="mono">${showTok(m.a)}</span> + <span class="mono">${showTok(m.b)}</span> → <span class="mono">${showTok(m.a+m.b)}</span></div>
      <div class="hint">Learned because this pair sat side by side ${m.count} times in the training text. Lower rule numbers were more common, so they are applied first.</div>`;
    await wait(timer?420:520);
    st.apply(p.r); applied++;
    draw(null, new Set([m.a+m.b]));
    const li = document.createElement('li');
    li.innerHTML = `<span><span class="mono">${showTok(m.a+m.b)}</span></span><span>rule ${p.r+1}</span>`;
    mLog.prepend(li);
    Narrator.say(`Rule ${p.r+1}: ${showTok(m.a)} + ${showTok(m.b)} → ${showTok(m.a+m.b)}`, [`The blue tiles were glued into one piece.`, `This pair sat side by side ${m.count} times in the training text.`, `Tokens now: <b>${st.tokens().length}</b>.`]);
    return true;
  }
  function finish(){
    stop();
    const n = st.tokens().length, start = Array.from(shared.text).length;
    mRule.innerHTML = `<div class="hint">No learned rule matches any neighbouring pair now.</div><div class="big">Done: ${start} characters → ${n} tokens</div><div class="hint">This is exactly what you get from the Subword (BPE) button above.</div>`;
    $('#mStep').disabled=true; $('#mEnd').disabled=true; $('#mPlay').disabled=true;
    Narrator.say('Merging finished', [`${applied} rules were applied.`, `${start} characters became <b>${n} tokens</b>.`, `Nobody wrote these rules. They were learned by counting which pairs sit together most often in the training text.`, `Count pairs, glue the most common one, repeat: that is Byte Pair Encoding (BPE).`], 'good');
  }
  $('#mStart').onclick = () => {
    stop(); if(!shared.text.trim()) return;
    st = Tok.stepper(shared.text); applied=0; mLog.innerHTML='';
    draw(); setBtns(false);
    mRule.innerHTML = `<div class="hint">Every character is its own token right now: ${st.tokens().length} tokens.</div><div class="big">Press “Merge next pair”.</div>`;
    Narrator.say('Back to single characters', [`Every character is its own token: <b>${st.tokens().length} tokens</b>.`, `Press <b>Merge next pair</b> to apply the first learned rule.`, `Rules run in order: the most common pair goes first.`]);
  };
  let stepping=false;
  $('#mStep').onclick = async () => { if(stepping) return; stepping=true; $('#mStep').disabled=true; await stepOnce(); stepping=false; if(st.peek()) $('#mStep').disabled=false; };
  $('#mPlay').onclick = () => {
    if(timer){ stop(); return; }
    $('#mPlay').textContent='❚❚ Pause'; setBtns(true); $('#mPlay').disabled=false;
    let running=false;
    timer = setInterval(async () => { if(running) return; running=true; const more = await stepOnce(); running=false; if(!more) stop(); }, reduceMotion?150:950);
  };
  $('#mEnd').onclick = () => { stop(); let p; while((p=st.peek())){ st.apply(p.r); applied++; } draw(); finish(); };

  Narrator.page('Free play: cutting text into tokens', [
    `A model never reads words. It reads <b>tokens</b>, small pieces of text.`,
    `The text box holds the student’s question. Edit it or pick a preset below it.`,
    `Choose a way to cut: spaces, every character, or subword (BPE).`,
    `Press <b>✂ Slice it</b>. Each coloured tile is one token.`,
    `The three boxes under the tiles count characters and tokens.`,
    `Lower down, <b>Watch the subword tokenizer work</b> replays BPE one step at a time.`], 'Press <b>✂ Slice it</b> to begin.');
  if(shared.sliced) slice(); 
  shared.sliced = true;
};

/* ---- Challenge ---- */
const CH_WORDS = ['attendance','tokenization','rethinking','unreadable','strawberry','ChatGPT'];
const ch = {i:0, cuts:new Set(), results:[], checked:false};
function answerCuts(word){
  // the word as it appears mid-sentence (with a leading space), then strip the space
  let toks = Tok.encodeWord(' '+word);
  if(toks[0]===' ') toks = toks.slice(1); else toks[0] = toks[0].slice(1);
  const cuts = new Set(); let pos=0;
  toks.slice(0,-1).forEach(t => { pos += Array.from(t).length; cuts.add(pos); });
  return {toks, cuts};
}
function cutsToPieces(word, cuts){
  const L = Array.from(word); const out=[]; let cur='';
  L.forEach((c,i)=>{ cur+=c; if(cuts.has(i+1) && i<L.length-1){ out.push(cur); cur=''; } }); out.push(cur); return out;
}
function jaccard(a,b){ if(!a.size && !b.size) return 1; let inter=0; a.forEach(x=>{ if(b.has(x)) inter++; }); return inter/(a.size+b.size-inter); }

S1.challenge = (panel) => {
  if(ch.i >= CH_WORDS.length){ return renderSummary(panel); }
  Narrator.page(`Challenge: word ${ch.i+1} of ${CH_WORDS.length}`, [

    `Click between two letters to place a cut. Click again to remove it.`,
    `No cuts means you think it is one token.`,
    `<b>Check my cuts</b> compares you with the tokenizer and gives a score.`,
    `<b>Reveal answer</b> shows the cuts, but the word scores 0.`,
    `Finish all ${CH_WORDS.length} words to earn the Station 1 badge.`], 'Place your cuts, then press <b>Check my cuts</b>.');
  const word = CH_WORDS[ch.i]; const L = Array.from(word);
  panel.innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Cut it like a tokenizer would</h2>
      <div class="dots" aria-label="Progress">${CH_WORDS.map((w,i)=>`<i class="${ch.results[i]? (ch.results[i].score>=.99?'good':ch.results[i].score>=.5?'mid':'bad') : i===ch.i?'on':''}"></i>`).join('')}</div>
    </div>
    <p class="hint">Word ${ch.i+1} of ${CH_WORDS.length}. Click between letters to place a cut. Click again to remove it. Leave the word whole if you think the tokenizer knows it as one piece. Imagine the word appears in the middle of a sentence.</p>
    <div class="cutword" id="cw">${L.map((c,i)=>{
      const letter = `<span class="letter ${i===0?'first':''} ${i===L.length-1?'last':''}" data-i="${i}">${esc(c)}</span>`;
      const gap = i<L.length-1 ? `<button class="gap" data-pos="${i+1}" aria-pressed="${ch.cuts.has(i+1)}" aria-label="Cut after letter ${i+1}, ${esc(c)}"></button>` : '';
      return letter+gap; }).join('')}</div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="chCheck">Check my cuts</button>
      <button class="btn ghost" id="chReveal">Reveal answer</button>
      <button class="btn" id="chNext" ${ch.checked?'':'disabled'}>${ch.i===CH_WORDS.length-1?'See my results':'Next word'}</button>
    </div>
    <div id="chOut"></div>
  </div>`;
  const cw = $('#cw');
  function paintCorners(){
    cw.querySelectorAll('.letter').forEach(l=>l.classList.remove('before-cut'));
    ch.cuts.forEach(p => { const l = cw.querySelector(`.letter[data-i="${p-1}"]`); if(l) l.classList.add('before-cut'); });
  }
  paintCorners();
  cw.addEventListener('click', e => {
    const g = e.target.closest('.gap'); if(!g || ch.checked) return;
    const p = +g.dataset.pos; ch.cuts.has(p) ? ch.cuts.delete(p) : ch.cuts.add(p);
    g.setAttribute('aria-pressed', ch.cuts.has(p)); paintCorners();
  });
  $('#chCheck').onclick = () => check(false);
  $('#chReveal').onclick = () => check(true);
  $('#chNext').onclick = () => { ch.i++; ch.cuts=new Set(); ch.checked=false; S1.challenge(panel); };
  if(ch.checked) check(ch.results[ch.i]?.revealed, true);

  function check(reveal, silent=false){
    const ans = answerCuts(word);
    const score = reveal ? 0 : jaccard(ch.cuts, ans.cuts);
    if(!ch.checked){ ch.results[ch.i] = {word, score, revealed:reveal}; }
    ch.checked = true;
    const r = ch.results[ch.i];
    $('#chCheck').disabled = true; $('#chReveal').disabled = true; $('#chNext').disabled = false;
    cw.querySelectorAll('.gap').forEach(g=>g.disabled=true);
    const mine = cutsToPieces(word, ch.cuts);
    const pct = Math.round(r.score*100);
    $('#chOut').innerHTML = `
      ${r.revealed ? `<div class="verdict"><span class="hint">Answer revealed, so this word scores 0.</span></div>` :
       `<div class="verdict"><span class="score" style="color:${r.score>=.99?'var(--mint)':r.score>=.5?'#B07D10':'var(--coral)'}">${pct}%</span><span>${r.score>=.99?'Exactly how the tokenizer cuts it.':r.score>=.5?'Close. Some of your cuts match.':'Different from the tokenizer.'}</span></div>`}
      <div class="compare">
        ${r.revealed?'':`<div class="who">Your cuts</div><div class="strip" style="min-height:0;padding:6px">${mine.map((t,i)=>tileHTML(t,i)).join('')}</div>`}
        <div class="who">Tokenizer</div><div class="strip" style="min-height:0;padding:6px" id="ansStrip">${ans.toks.map((t,i)=>tileHTML(t,i,'pop')).join('')}</div>
      </div>`;

    const pts = [];
    pts.push(r.revealed ? `Answer revealed, so this word scores 0.` : `Your score: <b>${pct}%</b>. ${r.score>=.99?'A perfect match.':r.score>=.5?'Some cuts match.':'Mostly different.'}`);
    if(ans.toks.length===1) pts.push(`The tokenizer keeps <b>${esc(word)}</b> as one token, because it appeared often in the training text.`);
    else {
      pts.push(`The tokenizer cuts <b>${esc(word)}</b> into ${ans.toks.length} pieces.`);
      ans.toks.slice(0,5).forEach(t => pts.push(Array.from(t).length===1
        ? `<span class="mono">${esc(t)}</span>: a lone character. No learned rule could join it to a neighbour.`
        : `<span class="mono">${esc(t)}</span>: appears ${Tok.countInCorpus(t)} times inside training words.`));
    }
    if(word==='strawberry') pts.push(`The model gets pieces, not letters, so counting the r’s is hard for it.`);
    if(word==='ChatGPT') pts.push(`Rare names break into many small pieces.`);
    if(word==='rethinking'||word==='unreadable') pts.push(`Pieces like “re”, “un”, “ing”, “able” are reused across many words.`);
    pts.push(ch.i===CH_WORDS.length-1 ? `Press <b>See my results</b>.` : `Press <b>Next word</b> to continue.`);
    Narrator.say(`Checked: “${esc(word)}”`, pts, r.revealed?'info':r.score>=.99?'good':r.score>=.5?'info':'warn');
  }
};
function renderSummary(panel){
  const total = Math.round(ch.results.reduce((a,r)=>a+r.score,0)/CH_WORDS.length*100);
  panel.innerHTML = `<div class="card">

    <p style="margin-top:16px">Nobody can guess a tokenizer perfectly. Its cuts come from counting its own training text, not from grammar or syllables. That is the main lesson.</p>

  Narrator.say('Challenge complete', [`Average match: <b>${total}%</b>.`, `Station 1 badge earned.`, `Tokenizer cuts come from counting training text, not from grammar or syllables.`], 'good');
  $('#toArch').onclick = () => { currentTab='architecture'; renderTabs(STATIONS[0]); };
  $('#again').onclick = () => { ch.i=0; ch.cuts=new Set(); ch.results=[]; ch.checked=false; S1.challenge(panel); };

S1.architecture = (panel) => {
  const STAGES = [
    {t:'Raw text', d:'What the student typed.'},
    {t:'Normalize', d:'Tidy Unicode so the same letter always has one form.'},
    {t:'Pre-tokenize', d:'Rough split into words, numbers and punctuation. Spaces stay attached.'},
    {t:'Apply merges', d:'BPE rules glue characters into learned pieces.'},
    {t:'Tokens', d:'Final pieces, ready to become IDs.'}
  ];
  panel.innerHTML = `
  <div class="card">
    <h2>What a real tokenizer does, stage by stage</h2>

    <label class="lbl" for="arText" style="margin-top:12px">Text going in</label>
    <input class="textin" id="arText" value="${esc(shared.text)}" spellcheck="false">
    <div class="flow" id="flow">${STAGES.map((s,i)=>`<div class="node" data-i="${i}"><div class="nn">Stage ${i+1}</div><div class="nt">${s.t}</div><div class="nd">${s.d}</div></div>`).join('')}</div>
    <div class="row"><button class="btn primary" id="arNext">Run stage 1</button><button class="btn" id="arAll">Run all stages</button><button class="btn ghost" id="arReset">Reset</button></div>
  </div>
  <div class="card stage-out" id="arOut"><p class="hint">The output of each stage appears here.</p></div>
  <div class="handoff" id="arHand" hidden><span style="font-size:1.6rem">→</span><p><b style="color:#fff">Next station: Token IDs.</b> These tokens are still text. A model only works with numbers, so each piece gets looked up in the vocabulary and swapped for its ID number.</p><button class="btn" id="toS2" style="margin-left:auto">Go to Station 2</button></div>`;
  let stage = -1;
  const out = $('#arOut');
  $('#toS2').onclick = () => go(2);
  const txt = () => $('#arText').value;
  $('#arText').addEventListener('input', e => { shared.text = e.target.value; reset(); });
  function reset(){ stage=-1; out.innerHTML='<p class="hint">The output of each stage appears here.</p>'; $('#arHand').hidden=true; paint(); $('#arNext').textContent='Run stage 1'; $('#arNext').disabled=false; }
  function paint(){ document.querySelectorAll('#flow .node').forEach((n,i)=>{ n.classList.toggle('active', i===stage); n.classList.toggle('passed', i<stage); }); }
  function show(i){
    const t = txt();
    if(i===0){
      out.innerHTML = `<h3>Stage 1 · Raw text</h3><div class="chunks"><span class="chunk">${esc(t)}</span></div><p class="hint" style="margin-top:10px">${Array.from(t).length} characters. To the computer this is just a sequence of character codes.</p>`;
      Narrator.say('Stage 1: raw text', ['The tokenizer receives exactly what was typed.', 'Capitals, spaces and punctuation are all kept.', `${Array.from(t).length} characters so far, still one long string.`]);
    } else if(i===1){
      const n = t.normalize('NFC'); const changed = n!==t;
      out.innerHTML = `<h3>Stage 2 · Normalize</h3><div class="chunks"><span class="chunk">${esc(n)}</span></div><p class="hint" style="margin-top:10px">${changed?'Some characters were rewritten into their standard form.':'Nothing needed changing here.'} Modern tokenizers for chat models keep capitals and spaces as they are, because “Apple” and “apple” can mean different things.</p>`;
      Narrator.say('Stage 2: normalize', ['Some letters can be stored two ways, like “é” as one code or two.', 'Normalizing makes them identical.', 'So the same text always gives the same tokens.', changed ? 'Some characters in your text were changed.' : 'Your text needed no changes.']);
    } else if(i===2){
      const ch = Tok.pretok(t.normalize('NFC'));
      out.innerHTML = `<h3>Stage 3 · Pre-tokenize</h3><div class="chunks">${ch.map(c=>`<span class="chunk">${showTok(c)}</span>`).join('')}</div><p class="hint" style="margin-top:10px">${ch.length} chunks. A pattern rule splits off words, groups of up to three digits, and punctuation. Each word keeps the space in front of it (shown as ␣). Merges never cross these boundaries.</p>`;
      Narrator.say('Stage 3: pre-tokenize', [`The text was split into ${ch.length} chunks.`, 'Like “split on spaces”, but punctuation is separated too.', 'Each word keeps its leading space (␣).', 'Later merges never cross from one chunk to another.']);
    } else if(i===3){
      const ch = Tok.pretok(t.normalize('NFC'));
      out.innerHTML = `<h3>Stage 4 · Apply merges</h3><div class="compare">${ch.slice(0,10).map(c=>`<div class="who">${showTok(c)}</div><div class="strip" style="min-height:0;padding:4px">${Tok.encodeWord(c).map((p,i)=>tileHTML(p,i)).join('')}</div>`).join('')}</div>${ch.length>10?`<p class="hint">…and ${ch.length-10} more chunks.</p>`:''}`;
      Narrator.say('Stage 4: apply merges', ['Inside each chunk, the learned BPE rules glue characters together.', 'Each row shows one chunk and its pieces.', 'This is what you did by hand in the challenge.', `This toy learned ${Tok.merges.length} rules. Real ones learn tens of thousands or more.`]);
    } else {

    }
  }
  async function next(){ if(stage>=4) return; stage++; paint(); show(stage); $('#arNext').textContent = stage>=4 ? 'Finished' : `Run stage ${stage+2}`; $('#arNext').disabled = stage>=4; }
  $('#arNext').onclick = next;
  $('#arAll').onclick = async () => { reset(); for(let i=0;i<5;i++){ await next(); await wait(700); } };
  $('#arReset').onclick = reset;
  paint();
  Narrator.page('Reveal: the real tokenizer pipeline', [
    `The five boxes are the stages a real tokenizer runs, left to right.`,
    `Press <b>Run stage</b> to move your text forward one stage.`,
    `The blue box is the current stage. Green boxes are done.`,
    `The panel below the boxes shows that stage’s output.`,
    `<b>Run all stages</b> plays the whole pipeline.`], 'Press <b>Run stage 1</b> to start.');
};

// Vocabulary laid out like Llama/SentencePiece: specials, 256 byte tokens, characters, learned pieces.
const Vocab = (() => {
  const items = []; const map = new Map();
  const add = (p, kind) => { if(map.has(p)) return; map.set(p, items.length); items.push({p, kind}); };
  ['<unk>','<|start|>','<|end|>'].forEach(p => add(p,'special'));
  for(let b=0;b<256;b++) add(`<0x${b.toString(16).toUpperCase().padStart(2,'0')}>`, 'byte');
  const chars = new Set(); for(let c=32;c<127;c++) chars.add(String.fromCharCode(c)); Tok.baseChars.forEach(c=>chars.add(c));
  [...chars].sort((a,b)=>a.codePointAt(0)-b.codePointAt(0)).forEach(c => add(c,'char'));
  Tok.merges.forEach(m => add(m.a+m.b, 'piece'));
  const enc = new TextEncoder(), dec = new TextDecoder();
  function lookup(tokens){
    const out = [];
    tokens.forEach((t, ti) => {
      if(map.has(t)) out.push({p:t, id:map.get(t), kind:items[map.get(t)].kind, src:ti});
      else Array.from(t).forEach(ch => {
        if(map.has(ch)) out.push({p:ch, id:map.get(ch), kind:'char', src:ti});
        else enc.encode(ch).forEach(b => { const p=`<0x${b.toString(16).toUpperCase().padStart(2,'0')}>`; out.push({p, id:map.get(p), kind:'byte', src:ti, fallback:ch}); });
      });
    });
    return out;
  }
  function decode(ids){
    let text='', bytes=[]; const parts=[]; const bad=[];
    const flush = () => { if(bytes.length){ text += dec.decode(new Uint8Array(bytes)); bytes=[]; } };
    ids.forEach(id => {
      const it = items[id];
      if(!it){ bad.push(id); return; }
      parts.push({id, ...it});
      if(it.kind==='byte') bytes.push(parseInt(it.p.slice(3,5),16));
      else { flush(); if(it.kind!=='special') text += it.p; }
    });
    flush();
    return {text, parts, bad};
  }
  return {items, map, lookup, decode, size: items.length, idOf: p => map.get(p)};
})();

// Seeded numbers for the embedding table (same every time).
function seeded(id, col){ let t = (id*2654435761 + col*40503) >>> 0; t ^= t>>>15; t = Math.imul(t, 0x2c1b3c6d)>>>0; t ^= t>>>12; return ((t % 2000)/1000 - 1); }

const PDF_VOCAB = () => ({"I":0, "love":1, "AI":2, "[UNK]":3});

function idTile(p, i, id, extra=''){
  return `<span class="tid">${tileHTML(p, i, extra)}<span class="idb ${id===undefined?'wait':''}">${id===undefined?'?':id}</span></span>`;
}
function lockerWallHTML(mode){
  if(mode==='word'){
    const entries = Object.entries(s2.wordVocab).sort((a,b)=>a[1]-b[1]);
    return `<div class="lsec">Word list vocabulary (${entries.length} words)</div>` + entries.map(([w,id]) =>
      `<button class="locker ${w==='[UNK]'?'special':''}" data-id="${id}" data-p="${esc(w)}"><span class="lid">${id}</span><span class="lp">${esc(w)}</span></button>`).join('');
  }
  const names = {special:'Special tokens', byte:'Raw bytes (fallback for any character)', char:'Single characters', piece:'Learned pieces (from BPE merges)'};
  let html='', last='';
  Vocab.items.forEach((it,id) => {
    if(it.kind!==last){ html += `<div class="lsec">${names[it.kind]}</div>`; last=it.kind; }
    html += `<button class="locker ${it.kind}" data-id="${id}" data-p="${esc(it.p)}" aria-label="ID ${id}: ${esc(it.p)}"><span class="lid">${id}</span><span class="lp">${showTok(it.p)}</span></button>`;
  });
  return html;
}
function scrollToLocker(wall, el){
  wall.scrollTop = el.offsetTop - wall.clientHeight/2 + el.offsetHeight/2;
}
function wireSearch(input, wall, onFound){
  input.addEventListener('input', () => {
    const q = input.value.replace(/␣/g,' ');
    wall.querySelectorAll('.locker.match').forEach(l=>l.classList.remove('match'));
    if(!q.trim()) return;
    const ls = [...wall.querySelectorAll('.locker')];
    let hits = /^\d+$/.test(q.trim()) ? ls.filter(l=>l.dataset.id===q.trim())
      : ls.filter(l=>l.dataset.p===q || l.dataset.p===' '+q.trim());
    if(!hits.length && !/^\d+$/.test(q.trim())) hits = ls.filter(l=>l.dataset.p.trim().toLowerCase().includes(q.trim().toLowerCase()));
    hits.slice(0,30).forEach(l=>l.classList.add('match'));
    if(hits[0]) scrollToLocker(wall, hits[0]);
    if(onFound) onFound(hits.length);
  });
}

    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${R.title}</h2>${dots}</div>
    <p class="hint">Round ${c2.i+1} of ${S2R.length}. ${esc(R.prompt)}</p>
    ${body}
    <div class="row" style="justify-content:center;margin-top:16px">
      <button class="btn primary" id="c2check">Check</button>
      <button class="btn ghost" id="c2reveal">Reveal answer</button>
      <button class="btn" id="c2next" disabled>${c2.i===S2R.length-1?'See my results':'Next round'}</button>
    </div>
    <div id="c2out"></div></div>`;

  const wall = $('#c2wall');
  if(wall){ wireSearch($('#c2search'), wall); }
  function drawPicks(){
    const box=$('#c2picks'); if(!box) return;
    box.innerHTML = c2.picks.length ? c2.picks.map((id,i)=>`<button class="pick" data-k="${i}" aria-label="Remove ${id}">${id} ✕</button>`).join('') : `<span class="hint">Click lockers below to add IDs.</span>`;
  }
  if(R.type==='encode'){
    drawPicks();
    wall.addEventListener('click', e => { const l=e.target.closest('.locker'); if(!l||c2.checked) return; c2.picks.push(+l.dataset.id); drawPicks();
      Narrator.say(`Added ID ${l.dataset.id}`, [`Locker ${l.dataset.id} holds <span class="mono">${showTok(l.dataset.p)}</span>.`, `Your list has ${c2.picks.length} of ${R.toks.length} IDs.`, `Click an ID in your list to remove it.`]); });
    $('#c2picks').addEventListener('click', e => { const b=e.target.closest('.pick'); if(!b||c2.checked) return; c2.picks.splice(+b.dataset.k,1); drawPicks(); });
  }
  if(R.type==='decode'){
    $('#c2text').addEventListener('input', e => c2.typed = e.target.value);
    wall.addEventListener('click', e => { const l=e.target.closest('.locker'); if(!l) return; Narrator.say(`Locker ${l.dataset.id}`, [`Holds <span class="mono">${showTok(l.dataset.p)}</span>.`, `␣ means a space comes before the word.`]); });
  }
  if(R.type==='mc'){
    $('#c2opts').addEventListener('click', e => { const b=e.target.closest('.opt'); if(!b||c2.checked) return; c2.choice=+b.dataset.i; $('#c2opts').querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed', o===b)); });
  }
  $('#c2check').onclick = () => check(false);
  $('#c2reveal').onclick = () => check(true);
  $('#c2next').onclick = () => { c2.i++; c2.checked=false; c2.picks=[]; c2.choice=null; c2.typed=''; S2.challenge(panel); };

  Narrator.page(`Challenge: round ${c2.i+1} of ${S2R.length}`, R.type==='encode' ? [
      `You are the vocabulary lookup.`, `Find the locker for each token, in order, and click it.`, `Search the wall by typing a token, like <span class="mono">minimum</span>.`, `<b>Check</b> compares your list with the real IDs.`, `<b>Reveal answer</b> shows them, but the round scores 0.`]
    : R.type==='decode' ? [
      `You are the decoder.`, `Look up each ID on the locker wall. Search by typing the number.`, `Glue the pieces together. ␣ means a space.`, `Type the text and press <b>Check</b>.`, `<b>Reveal answer</b> shows the text, but the round scores 0.`]
    : [`Read the question and pick one answer.`, `Press <b>Check</b> to see if you are right.`, `<b>Reveal answer</b> shows the answer, but the round scores 0.`],
    R.type==='mc' ? 'Pick an answer, then press <b>Check</b>.' : 'Nothing yet. Start on the task above.');

  function check(reveal){
    if(c2.checked) return;
    if(!reveal){
      if(R.type==='encode' && !c2.picks.length){ Narrator.say('No IDs yet', ['Click at least one locker first.']); return; }
      if(R.type==='mc' && c2.choice===null){ Narrator.say('No answer picked', ['Choose one of the options first.']); return; }
      if(R.type==='decode' && !c2.typed.trim()){ Narrator.say('No text yet', ['Type your decoded text first.']); return; }
    }
    c2.checked=true;
    let score=0, pts=[];
    const out=$('#c2out');
    if(R.type==='encode'){
      const right = R.answer.filter((id,i)=>c2.picks[i]===id).length;
      score = reveal?0 : (right===R.answer.length && c2.picks.length===R.answer.length ? 1 : right/Math.max(R.answer.length,c2.picks.length));
      out.innerHTML = `<div class="compare" style="margin-top:14px">${reveal?'':`<div class="who">Your IDs</div><div class="idarr"><code>[${c2.picks.join(', ')}]</code></div>`}<div class="who">Correct</div><div class="strip" style="min-height:0">${R.toks.map((t,i)=>idTile(t,i,R.answer[i],'pop')).join('')}</div></div>`;
      pts = [reveal?'Answer revealed, so this round scores 0.':`Your score: <b>${Math.round(score*100)}%</b>.`, `Each token has exactly one locker, so its ID is always the same.`, `This lookup is all that “assigning token IDs” means.`];
    } else if(R.type==='decode'){
      const norm = s => s.trim().replace(/\s+/g,' ').toLowerCase();
      score = reveal?0 : (norm(c2.typed)===norm(R.answer)?1:0);
      out.innerHTML = `<div class="compare" style="margin-top:14px"><div class="who">Correct</div><div class="strip" style="min-height:0">${Vocab.decode(R.ids).parts.map((p,i)=>idTile(p.p,i,p.id,'pop')).join('')}</div><div class="who">Text</div><div><b>${esc(R.answer)}</b></div></div>`;
      pts = [reveal?'Answer revealed, so this round scores 0.': score? 'Correct.' : `Not quite. You typed “${esc(c2.typed)}”.`, `Decoding is the lookup in reverse: ID → piece → glue the pieces.`, `Every reply you get from a chatbot is decoded this way.`];
    } else {
      score = reveal?0 : (c2.choice===R.correct?1:0);
      $('#c2opts').querySelectorAll('.opt').forEach((o,i)=>{ o.disabled=true; if(i===R.correct) o.classList.add('right'); else if(i===c2.choice) o.classList.add('wrong'); });
      out.innerHTML = `<p style="margin-top:14px">${R.reveal}</p>`;
      pts = [reveal?'Answer revealed, so this round scores 0.': score?'Correct.':'Not this one. The green option is right.', R.reveal];
    }
    c2.results[c2.i] = {score, revealed:reveal};
    pts.push(c2.i===S2R.length-1?'Press <b>See my results</b>.':'Press <b>Next round</b>.');
    Narrator.say(`Round ${c2.i+1} checked`, pts, reveal?'info':score>=.99?'good':score>0?'info':'warn');
    $('#c2check').disabled=true; $('#c2reveal').disabled=true; $('#c2next').disabled=false;
  }
};

/* ---- Architecture ---- */
S2.architecture = (panel) => {

    {t:'Tokens', d:'The pieces from Station 1.'},

  panel.innerHTML = `
  <div class="card">

  const text = shared.text.trim() || QUESTION;

    `The six boxes are the stages, left to right.`,
    `Press <b>Run stage</b> to move the question one stage forward.`,

    `The panel below the boxes shows that stage’s output.`,
    `Stage 5 shows the embedding table, where IDs become numbers the model can learn from.`], 'Press <b>Run stage 1</b> to start.');
};

/* =========================================================
   Step-by-step walkthrough (used by every station's Explore tab)
   ========================================================= */
const walkState = {};
function Walk(panel, key, steps){
  if(!walkState[key]) walkState[key] = {i:0, done:new Set(), max:0};
  const W = walkState[key];
  const station = STATIONS.find(x=>x.n===current);
  function render(){
    const s = steps[W.i];
    const last = W.i===steps.length-1;
    panel.innerHTML = `
      <ol class="wsteps" aria-label="Steps">${steps.map((x,i)=>`<li><button class="wpill ${i===W.i?'cur':''} ${W.done.has(i)||(!x.action&&i<W.i)?'ok':''}" data-i="${i}" ${i>W.max?'disabled':''} ${i===W.i?'aria-current="step"':''}><span class="wn">${i+1}</span><span class="wl">${esc(x.short)}</span></button></li>`).join('')}</ol>
      <div class="card wcard">
        <p class="wnum">Step ${W.i+1} of ${steps.length}</p>
        <h2 class="wtitle">${s.title}</h2>
        <div class="wtext">${s.text}</div>
        ${s.wide?'':'<div class="wstage" id="wstage"></div>'}
        <div class="keyidea" id="wkey" hidden><span class="kl">Key idea</span><span id="wkeyText"></span></div>
        <div class="wnav">
          <button class="btn ghost" id="wBack" ${W.i===0?'disabled':''}>← Back</button>
          <span class="hint" id="wHint"></span>
          <button class="btn primary" id="wNext">${last?'Go to the challenge':'Next step →'}</button>
        </div>
      </div>
      ${s.wide?'<div id="wstage"></div>':''}`;
    const stage = $('#wstage');
    const nextBtn = $('#wNext'), hint = $('#wHint');
    const needs = s.action && !W.done.has(W.i);
    nextBtn.disabled = needs;
    hint.textContent = needs ? 'Do the step above to unlock the next one.' : '';
    function showKey(text){ $('#wkeyText').innerHTML = text; $('#wkey').hidden = false; }
    const api = {
      done(keyText){
        W.done.add(W.i); W.max = Math.max(W.max, W.i+1);
        nextBtn.disabled = false; hint.textContent = '';
        W.keys = W.keys || {}; W.keys[W.i] = keyText || s.key;
        if(W.keys[W.i]) showKey(W.keys[W.i]);
        panel.querySelector(`.wpill[data-i="${W.i}"]`)?.classList.add('ok');
        const nb = panel.querySelector(`.wpill[data-i="${W.i+1}"]`); if(nb) nb.disabled = false;
      }
    };
    if(!s.action) W.max = Math.max(W.max, W.i+1);
    if(W.done.has(W.i) && W.keys && W.keys[W.i]) showKey(W.keys[W.i]);
    panel.querySelectorAll('.wpill').forEach(b => b.onclick = () => { W.i = +b.dataset.i; render(); });
    $('#wBack').onclick = () => { W.i--; render(); };
    nextBtn.onclick = () => { if(last){ currentTab='challenge'; renderTabs(station); } else { W.i++; render(); } };
    Narrator.page(`Step ${W.i+1} of ${steps.length}: ${s.short}`, s.guide, s.idle || 'Do the action in this step to continue.');
    s.render(stage, api);
    if(!reduceMotion) panel.scrollIntoView({block:'nearest'});
  }
  render();
}

// Shared animation: cut a slab of text into tiles with a sweeping blade.
async function cutInto(strip, toks, extra=()=>''){
  strip.className = 'strip joined';

const LM = (() => {
  const words = CORPUS.toLowerCase().match(/[a-z0-9]+|[.?!]/g);
  const next = new Map();
  for(let i=0;i<words.length-1;i++){ const a=words[i], b=words[i+1]; if(!next.has(a)) next.set(a,new Map()); const m=next.get(a); m.set(b,(m.get(b)||0)+1); }
  const counts = w => [...(next.get(w)||new Map())].sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0]));
  function probs(w, T=1, k=Infinity){
    const c = counts(w).slice(0,k); if(!c.length) return [];
    const wt = c.map(([x,n])=>Math.pow(n, 1/T)); const s = wt.reduce((a,b)=>a+b,0);
    return c.map(([x,n],i)=>({w:x, c:n, p:wt[i]/s}));
  }
  const sample = list => { let r=Math.random(); for(const x of list){ r-=x.p; if(r<=0) return x; } return list[list.length-1]; };
  const tokenize = t => (t.toLowerCase().match(/[a-z0-9]+|[.?!]/g) || []);
  return {counts, probs, sample, tokenize, size: words.length};
})();
function tempProbs(items, T){ const wt=items.map(x=>Math.pow(x.c,1/T)); const s=wt.reduce((a,b)=>a+b,0); return items.map((x,i)=>({...x, p:wt[i]/s})); }
const pct = p => (p*100 < 1 && p>0) ? '<1%' : Math.round(p*100)+'%';

function wheelHTML(id){ return `<div class="wheel" id="${id}"><div class="pointer" aria-hidden="true">▼</div><svg viewBox="-110 -110 220 220" role="img" aria-label="Probability wheel"><g class="wg"></g><circle r="14" fill="var(--ink)"/></svg></div>`; }
function drawWheel(root, items){
  const g = root.querySelector('.wg'); let a=0, html='';
  const pt = (ang, r) => [r*Math.sin(ang*Math.PI/180), -r*Math.cos(ang*Math.PI/180)];
  items.forEach((x,i) => {
    const w = x.p*360, a1 = a+w;
    if(items.length===1){ html += `<circle r="100" fill="${WHEEL_COLORS[0]}"/>`; }
    else { const [x0,y0]=pt(a,100), [x1,y1]=pt(a1,100); html += `<path d="M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A100 100 0 ${w>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${WHEEL_COLORS[i%8]}" stroke="#fff" stroke-width="1.5"/>`; }
    if(w > 14){ const [lx,ly]=pt(a+w/2, 62); html += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${w>40?13:10}" font-weight="700" fill="#1C2541">${esc(x.w)}</text>`; }
    x._a0 = a; x._a1 = a1; a = a1;
  });
  g.innerHTML = html; root._items = items;
}
async function spinWheel(root, pick){
  const g = root.querySelector('.wg'); const it = root._items.find(x=>x.w===pick.w);
  const width = it._a1-it._a0; const c = it._a0 + width/2 + (Math.random()-.5)*width*.6;
  const cur = root._rot || 0;
  const target = cur + 1440 + (((360 - c) - (cur % 360)) % 360 + 720) % 360;
  root._rot = target;
  g.style.transition = reduceMotion ? 'none' : 'transform 1.8s cubic-bezier(.17,.67,.2,1)';
  g.style.transform = `rotate(${target}deg)`;
  await wait(1850);
}
