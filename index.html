function boardHTML(id, members){ return `<div class="board" id="${id}">${members.map(m=>`<div class="ag" data-a="${m}" style="--ac:${AGENTS[m].c}"><b>${AGENTS[m].name}</b><span>${AGENTS[m].role}</span>${AGENTS[m].tools.length?`<i>${AGENTS[m].tools.map(t=>`<code>${t}</code>`).join(' ')}</i>`:''}</div>`).join('')}</div><ol class="mlog" id="${id}-log"></ol>`; }
async function playEvents(id, ev, fast=false){
  const b=$('#'+id), log=$('#'+id+'-log'); log.innerHTML='';
  for(const e of ev){ b.querySelectorAll('.ag').forEach(a=>a.classList.remove('send','recv'));
    b.querySelector(`.ag[data-a="${e.from}"]`)?.classList.add('send'); if(e.to!==e.from) b.querySelector(`.ag[data-a="${e.to}"]`)?.classList.add('recv');
    log.insertAdjacentHTML('beforeend', `<li class="mm ${e.kind}"><span class="mf" style="color:${AGENTS[e.from].c}">${AGENTS[e.from].name}</span>${e.to!==e.from?` → <span class="mf" style="color:${AGENTS[e.to].c}">${AGENTS[e.to].name}</span>`:''}<div>${esc(e.text)}</div></li>`); log.scrollTop=log.scrollHeight;
    await wait(fast?160:850); }
  b.querySelectorAll('.ag').forEach(a=>a.classList.remove('send','recv'));
}

function runAgentSync(type, rolls){ const S=newAgent(type, rolls); for(let i=0;i<8;i++){ const p=planNext(S); S.steps++; if(p.finish) return {answer:p.finish, steps:S.steps}; const out=runTool(p.act); observe(S,p.act,out); } return {answer:'I ran out of steps.', steps:S.steps}; }

// The finished helpdesk bot. `on` says which parts are switched on.
function hdBot(q, history, on){
  const t=q.toLowerCase(), used=new Set(['prompt','tok','ids','emb','llm']), notes=[];
  const rolls = (q.match(/\b\d{2}[a-z]{2,4}\d{2,4}\b/gi)||[]).map(r=>r.toUpperCase());
  const hist = on.memory ? history.slice(-6) : [];
  if(on.memory && history.length) used.add('memory');
  const say = (text, extra={}) => ({text, used:[...used], notes, tokens: Tok.bpe(hist.map(m=>m.text).join(' ')+' '+q).length + 40, ...extra});
  let m;
  if((m=q.match(/my name is (\w+)/i))) return say(`Hi ${m[1]}! How can I help you today?`);
  if(/what('?s| is) my name/.test(t)){ const intro = (on.memory?history:[]).map(x=>x.text.match(/my name is (\w+)/i)).find(Boolean);
    if(intro){ used.add('memory'); notes.push(history.slice(-6).some(x=>/my name is/i.test(x.text)) ? 'Found the name in the recent conversation history.' : 'The name was said long ago, but it was kept as a pinned fact (Station 6).'); return say(`Your name is ${intro[1]}.`); }
    notes.push(on.memory?'No name anywhere in the history.':'Memory is off, so earlier messages were not sent.'); return say('I don’t know your name. I can’t see it in this conversation.'); }
  if(/\b(notice|announcement)\b/.test(t)){
    if(on.team && on.tools && on.rag){ const r=simulateTeam({team:new Set(['researcher','analyst','writer','reviewer']), pattern:'supervisor', req:'notice'}); used.add('team'); used.add('agent'); used.add('tools'); used.add('rag'); notes.push(`A supervisor and 4 specialists worked on it: ${r.calls} model calls, ${r.tools} tool calls, reviewed before publishing.`); return say(r.output); }
    if(on.agent && on.tools && on.rag){ used.add('agent'); used.add('tools'); used.add('rag'); const a=runAgentSync('avg',ROLLS3); notes.push(`One agent did everything in ${a.steps+1} steps, with nobody checking its work.`); return say(noticeText(75, 81)); }
    notes.push('Writing a notice needs the rule, the records and several steps.'); return say(on.rag?'I can tell you the rule is 75% attendance, but I can’t gather the records and write a full notice by myself.':'I’m not able to write that notice with the parts I have.');
  }
  if(rolls.length>=2 || (rolls.length && /\b(sit|exam|eligible)\b/.test(t) && !/\bmy attendance\b/.test(t))){
    if(on.agent && on.tools){ used.add('agent'); used.add('tools'); if(on.rag) used.add('rag'); const a=runAgentSync('exam', rolls); notes.push(`The agent loop took ${a.steps} steps: handbook search, ${rolls.length} lookup${rolls.length>1?'s':''}, then compare.`); return say(a.answer); }
    if(on.tools){ used.add('tools'); const c={name:'lookup_attendance', args:{roll_number:rolls[0]}}; const {result,err}=runTool(c); notes.push('Without the agent loop, it can only make one tool call per question.'); return say(err?`I couldn’t find ${rolls[0]}.`:`I can only check one student at a time. ${result.name} (${rolls[0]}) has ${result.pct}%.`); }
    notes.push('Tools are off, so student records can’t be reached.'); return say('I can’t access student records, so I can’t check that.');
  }
  if(rolls.length===1 || (/\bmy attendance\b/.test(t))){
    if(!rolls.length) return say('Please tell me your roll number, for example 23BCS101, and I’ll check your attendance.');
    if(on.tools){ used.add('tools'); const c={name:'lookup_attendance', args:{roll_number:rolls[0]}}; const {result,err}=runTool(c); notes.push(`Tool call: ${callJSON(c)}`); return say(finalAnswer(c,result,err)); }
    notes.push('Tools are off, so the attendance database can’t be reached.'); return say('I can’t access student records, so I can’t tell you your attendance.');
  }
  // Questions answered from the handbook
  let query=q; const followUp = /\b(it|that|this)\b/.test(t) && words4(q).length<=9 && !FEATS.some(f=>f.words.some(w=>words4(q).includes(w)));
  if(followUp){ const lastU=[...hist].reverse().find(x=>x.role==='user'); if(lastU){ query = lastU.text+' '+q; used.add('memory'); notes.push(`“${q.match(/\b(it|that|this)\b/i)[0]}” was understood using the previous question.`); } else notes.push(on.memory?'Nothing earlier to explain what “it” means.':'Memory is off, so “it” can’t be understood.'); }
  if(!on.rag){ notes.push('Retrieval is off, so the model can only guess from its training.'); return say(followUp&&!hist.length?'Sorry, I’m not sure what you mean. Could you give more detail?':hdReply({})); }
  used.add('rag'); const hits=retrieve(query, BOT_CHUNKS(), 1); const a=extractiveAnswer(q, hits);
  if(followUp && !hist.length){ notes.push('Nothing matched clearly.'); return say('Sorry, I’m not sure what “it” refers to. Could you say what you mean?'); }
  if(a.found) notes.push(`Retrieved “${hits[0].title}” (score ${hits[0].score.toFixed(2)}).`); else notes.push('No handbook page matched well enough, so it said so.');
  return say(a.text, {source:a.source});
}

     const draw = (mark) => { $('#ptray').innerHTML = order.map(p=>`<button class="chip pchip ${sel===p.k?'sel':''} ${Object.values(P).includes(p.k)?'used':''}" data-p="${p.k}"><b>${p.st}</b> ${esc(p.t)}</button>`).join('');
       st.querySelectorAll('.slot').forEach(s=>{ const pk=P[s.dataset.k]; s.querySelector('.sp').innerHTML = pk ? `<b>${PARTS.find(p=>p.k===pk).st}</b> ${esc(PARTS.find(p=>p.k===pk).t)}` : '<i>empty</i>'; s.classList.toggle('filled', !!pk); s.classList.remove('ok','bad'); if(mark && pk) s.classList.add(pk===s.dataset.k?'ok':'bad'); }); };
     draw();
     $('#ptray').onclick = e => { const b=e.target.closest('.pchip'); if(!b) return; sel=b.dataset.p; draw(); Narrator.say(`Part: ${PARTS.find(p=>p.k===sel).t}`, [`Taught in Station ${PARTS.find(p=>p.k===sel).st}.`, 'Now click the slot that describes its job.']); };
     $('#bp').onclick = e => { const s=e.target.closest('.slot'); if(!s||!sel) return; Object.keys(P).forEach(k=>{ if(P[k]===sel) delete P[k]; }); P[s.dataset.k]=sel; sel=null; draw(); };
     $('#pchk').onclick = () => { const n=Object.keys(P).length; if(n<10){ Narrator.say('Not finished', [`${n} of 10 slots are filled.`]); return; }
       const right=PARTS.filter(p=>P[p.k]===p.k).length; draw(true);
       if(right===10){ Narrator.say('The blueprint is complete', ['Before the model: memory, retrieval, tools and the prompt.', 'Inside: tokenizer, IDs, embeddings and the predictor.', 'Around it: the agent loop and the team.'], 'good'); api.done('A real AI assistant is <b>many parts working together</b>. The LLM is only one of them.'); }
       else Narrator.say(`${right} of 10 correct`, ['Red slots have the wrong part.', 'Read each slot’s job again, and think about what that station taught.'], 'warn'); };
     $('#prev').onclick = () => { PARTS.forEach(p=>P[p.k]=p.k); draw(true); Narrator.say('Blueprint revealed', ['Every part is now in its correct slot.', 'Read through each one to remember what it does.']); api.done('A real AI assistant is <b>many parts working together</b>. The LLM is only one of them.'); };
     $('#pclr').onclick = () => { Object.keys(P).forEach(k=>delete P[k]); sel=null; draw(); };
   }},
  {short:'One question, every part', title:'Send the student’s question through the whole bot', action:true,
   text:`<p>Simran has already said hello. Now she asks: <b>“${esc(QUESTION)}”</b></p><p>Watch the question travel through every part, one stage at a time.</p>`,
   guide:['Press <b>Next stage</b> to move through the parts.', 'The list on the left shows where the question is.', 'Use “Revisit Station” links to go back to any station.'], idle:'Press <b>Next stage</b>.',
   render(st, api){ e2eRunner(st, () => api.done('One question used memory, retrieval, a prompt, the tokenizer, IDs, embeddings and the predictor. Harder requests also use tools, the agent loop and the team.')); }},
  {short:'Break a part', title:'Switch a part off and see what breaks', action:true,
   text:`<p>Each part has a job. Switch one off, then run the four test questions to see which ones fail.</p>`,
   guide:['Switch off one or more parts.', 'Press <b>Run the tests</b>.', 'Try breaking at least two different parts.'], idle:'Switch a part off, then press <b>Run the tests</b>.',
   render(st, api){
     const on={...ALL_ON}; const broke=new Set();
     const keys=[['memory','Conversation memory'],['rag','Retriever (RAG)'],['tools','Tools'],['agent','Agent loop']];
     st.innerHTML = `<div class="row">${keys.map(([k,l])=>`<label class="toggle sw" style="color:var(--ink)"><input type="checkbox" data-k="${k}" checked> ${l}</label>`).join('')}</div><div class="row wact"><button class="btn primary" id="wb">Run the tests</button></div><div id="wo"></div>`;
     st.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>on[i.dataset.k]=i.checked);
     $('#wb').onclick = () => { const off=keys.filter(([k])=>!on[k]); let hist=[];
       const res = BREAK_TESTS.map(T=>{ const r=hdBot(T.q, hist, on); hist=[...hist, {role:'user', text:T.q}, {role:'assistant', text:r.text}]; return {T, r, ok:T.ok(r.text)}; });
       $('#wo').innerHTML = `<table class="lt" style="margin-top:12px"><thead><tr><th>Test question</th><th>Bot’s answer</th><th></th></tr></thead><tbody>${res.map(x=>`<tr class="${x.ok?'':'failrow'}"><td>${esc(x.T.q)}</td><td>${esc(x.r.text)}</td><td><b style="color:${x.ok?'var(--mint)':'var(--coral)'}">${x.ok?'✓':'✗'}</b></td></tr>`).join('')}</tbody></table>`;
       const fails=res.filter(x=>!x.ok).length; off.forEach(([k])=>broke.add(k));
       Narrator.say(off.length?`Switched off: ${off.map(o=>o[1]).join(', ')}`:'Everything on', off.length?[`${fails} of 4 tests failed.`, ...res.filter(x=>!x.ok).slice(0,2).map(x=>x.r.notes[x.r.notes.length-1]||''), broke.size<2?'Try breaking a different part.':'Every part is needed for some kind of question.']:['All four tests pass with every part switched on.', 'Now switch one off.'], off.length?'warn':'good');
       if(broke.size>=2) api.done('Every part does a job: <b>memory</b> for follow-ups, <b>retrieval</b> for college facts, <b>tools</b> for records, the <b>agent loop</b> for multi-step goals.'); };
   }},
  {short:'Chat with the bot', title:'Free play: chat with the College Helpdesk Bot', wide:true,
   text:`<p>This is the finished bot, built from all ten stations. Ask anything about college rules, check attendance with roll numbers 23BCS101 to 23BCS103, ask a follow-up, or ask for a notice. The panel shows which parts ran for each answer.</p>`,
   guide:[], render(st){ S11.sandbox(st); }}
]);

S11.sandbox = (el) => {
  const PRE = ['Hi, my name is Simran.', QUESTION, 'What happens if I fall below it?', 'What is my attendance? Roll number 23BCS101', 'Which of 23BCS101, 23BCS102, 23BCS103 can sit the final exam?', 'Write a notice for students about the attendance rule', 'When is the library open?', 'What is my name?', 'Is there a dress code?'];
  el.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><div class="row">${[['memory','Memory'],['rag','Retrieval'],['tools','Tools'],['agent','Agent loop'],['team','Agent team']].map(([k,l])=>`<label class="toggle sw" style="color:var(--ink)"><input type="checkbox" data-k="${k}" ${s11.on[k]?'checked':''}> ${l}</label>`).join('')}</div><button class="btn ghost" id="fclr">New chat</button></div></div>
    <div class="botwrap"><div class="card" style="margin:0"><div class="chat scrolly" id="fchat" style="min-height:260px"></div>
      <div class="row" style="margin-top:12px"><input class="textin" id="fq" placeholder="Ask the helpdesk…" style="flex:1;min-width:200px;min-height:0;padding:10px 14px"><button class="btn primary" id="fgo">Send</button></div>
      <div class="row" style="margin-top:8px">${PRE.map((p,i)=>`<button class="chip" data-i="${i}">${esc(p)}</button>`).join('')}</div></div>
    <div class="card hood" style="margin:0"><h3>Under the hood</h3><div id="fhood"><p class="hint">Send a message to see which parts ran.</p></div></div></div>`;
  const draw = () => { $('#fchat').innerHTML = s11.chat.length ? s11.chat.map(m=>bubble(m.role, esc(m.text))).join('') : '<p class="hint">Say hello, or pick a question below.</p>'; $('#fchat').scrollTop=$('#fchat').scrollHeight; };
  draw();
  let busy=false;
  async function send(text){
    if(busy || !text.trim()) return; busy=true; $('#fq').value='';
    const r = hdBot(text, s11.chat, s11.on); s11.chat.push({role:'user', text});
    $('#fchat').insertAdjacentHTML('beforeend', bubble('user', esc(text)) + `<div class="cb assistant"><span class="cr">ASSISTANT</span><div class="ct" id="flast"></div></div>`); $('#fchat').querySelector('.hint')?.remove(); $('#fchat').scrollTop=$('#fchat').scrollHeight;
    $('#fhood').innerHTML = `${usedChips(r.used)}<ul class="tips">${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}<li>About ${r.tokens} tokens were sent to the model.</li></ul>`;
    await streamInto($('#flast'), r.text); $('#flast').removeAttribute('id'); s11.chat.push({role:'assistant', text:r.text});
    const extra = PARTS.filter(p=>r.used.includes(p.k) && ['memory','rag','tools','agent','team'].includes(p.k)).map(p=>p.t);
    Narrator.say('The bot answered', [extra.length?`Parts used beyond the model: ${extra.join(', ')}.`:'Only the core model parts were needed.', ...r.notes.slice(0,2)], 'info');
    busy=false;
  }
  $('#fgo').onclick = () => send($('#fq').value); $('#fq').addEventListener('keydown', e=>{ if(e.key==='Enter') send($('#fq').value); });
  el.querySelectorAll('.chip[data-i]').forEach(b=>b.onclick=()=>send(PRE[+b.dataset.i]));
  el.querySelectorAll('input[data-k]').forEach(i=>i.onchange=()=>{ s11.on[i.dataset.k]=i.checked; Narrator.say(`${i.parentElement.textContent.trim()} ${i.checked?'on':'off'}`, [i.checked?'This part is back.':'Ask a question that needs it and see what changes.']); });
  $('#fclr').onclick = () => { s11.chat=[]; draw(); $('#fhood').innerHTML='<p class="hint">Send a message to see which parts ran.</p>'; };
  Narrator.page('Free play: the finished bot', ['Type a question or pick one below.', '“Under the hood” lights up the parts used for each answer.', 'Switch parts off at the top to see what they do.', 'The bot is built from this lab’s small simulated parts, not a real LLM, so it handles college questions best.'], 'Pick a question or type your own.');
};

/* ---- Challenge: one question per station ---- */
const S11R = [
  {title:'Station 1 · Tokens', prompt:'Why do real models use subword tokens instead of whole words?', options:['Subwords look nicer','They can build any word from a manageable vocabulary','Whole words are illegal','Subwords are always one letter'], correct:1, why:'Common words stay whole, rare ones are built from pieces, so nothing is unknown and the vocabulary stays a manageable size.'},
  {title:'Station 2 · IDs', prompt:'Token 512 and token 513 are next to each other in the vocabulary. This means…', options:['Their meanings are similar','Nothing about meaning. They are just neighbouring lockers','513 is more important','They always appear together'], correct:1, why:'An ID only identifies a token, like a roll number.'},
  {title:'Station 3 · Prediction', prompt:'What does raising the temperature do?', options:['Makes answers more varied and random','Makes the model run faster','Makes answers shorter','Turns tools on'], correct:0, why:'Higher temperature evens out the wheel, so less likely words get picked more often.'},
  {title:'Station 4 · Embeddings', prompt:'Two words have a cosine similarity close to 1. What does that tell you?', options:['They are spelled the same','Their arrows point the same way, so their meanings are similar','They have the same token ID','One is the opposite of the other'], correct:1, why:'Cosine similarity measures direction. Close to 1 means very similar meaning.'},
  {title:'Station 5 · Prompts', prompt:'Which part of a prompt gives the model the facts it needs?', options:['The tone','The context','The format','The role'], correct:1, why:'Context supplies facts. Without it, the model has to guess.'},
  {title:'Station 6 · Memory', prompt:'How does a chatbot understand “it” in a follow-up question?', options:['The model remembers past chats','The app sends the earlier messages again','It guesses randomly','It searches the internet'], correct:1, why:'The model has no memory. The app re-sends the history every turn.'},
  {title:'Station 7 · RAG', prompt:'What does the retriever hand to the LLM?', options:['The whole internet','The most relevant chunks of the documents','The token IDs only','A random page'], correct:1, why:'It finds the best-matching chunks, which go into the prompt as context.'},
  {title:'Station 8 · Tools', prompt:'When the bot looks up attendance, who actually runs the lookup code?', options:['The model’s neural network','The app','The student','The tokenizer'], correct:1, why:'The model only asks with a tool call. The app runs the tool and sends the result back.'},
  {title:'Station 9 · Agents', prompt:'What guarantees an agent can’t loop forever?', options:['A step limit','A bigger vocabulary','A higher temperature','More embeddings'], correct:0, why:'A maximum number of steps (and a budget) always ends the loop.'},
  {title:'Station 10 · Teams', prompt:'In an agent team, which agent stops mistakes from being published?', options:['The Writer','The Reviewer','The Student','The Tokenizer'], correct:1, why:'The Reviewer checks the work against the sources and sends it back for fixes.'}
];
const c11 = {i:0, results:[], checked:false, choice:null};
S11.challenge = (panel) => runMC(panel, 11, S11R, c11);

/* ---- Architecture ---- */
S11.architecture = (panel) => {
  panel.innerHTML = `<div class="card"><h2>The complete College Helpdesk Bot</h2>
    <p class="hint">Every part, where it sits, and the station that taught it. Click a part to revisit its station.</p>
    <div class="blueprint arch">${Object.entries(ZONES).map(([z,zl])=>`<div class="zone ${z}"><div class="zl">${zl}</div><div class="slots">${PARTS.filter(p=>p.zone===z).map(p=>`<button class="slot filled ok" data-go="${p.st}"><span class="sp"><b>${p.st}</b> ${esc(p.t)}</span><span class="sd">${esc(p.d)}</span></button>`).join('')}</div></div>`).join('<div class="zarrow" aria-hidden="true">↓</div>')}</div></div>
    <div class="card"><h3>Run the student’s question through it</h3><div id="arun"></div></div>`;
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  e2eRunner($('#arun'));
  Narrator.page('Reveal: the complete bot', ['The blueprint shows all ten parts in three zones.', 'Click any part to go back to its station.', 'Below it, run the student’s question through the whole system.'], 'Press <b>Next stage</b> or click a part.');
};

/* ---- Real world: toy vs real, and the certificate ---- */
S11.realworld = (panel) => {
  const done = n => !!store.data.done[n];
  const nDone = STATIONS.slice(0,10).filter(s=>done(s.n)).length;
  const ROWS = [
    ['Tokenizer vocabulary', `${Vocab.size} pieces`, '32,000 to 200,000+ pieces'],
    ['Training text', `${Tok.corpusWordCount} words`, 'Trillions of tokens'],
    ['Embedding size', '2 to 32 numbers', 'Hundreds to thousands of numbers'],
    ['Next-word predictor', 'Word counting and scripted replies', 'A transformer with billions of learned numbers'],
    ['Context window', '80 tokens (Station 6)', '128,000 to 2,000,000 tokens'],
    ['Documents for RAG', `${DOCS.length} short pages`, 'Thousands of pages in a vector database'],
    ['Tools', `${Object.keys(TOOLS).length} small functions`, 'Databases, email, calendars, code, the web']
  ];
  panel.innerHTML = `<div class="card"><h2>This lab vs a real AI assistant</h2><p class="hint">Every idea here is real. The sizes are tiny so you can see inside.</p>
    <table class="lt"><thead><tr><th>Part</th><th>In this lab</th><th>In real products</th></tr></thead><tbody>${ROWS.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h3>Your progress</h3><div class="badges">${STATIONS.slice(0,10).map(s=>`<button class="bdg ${done(s.n)?'on':''}" data-go="${s.n}"><b>${s.n}</b><span>${esc(s.name)}</span><i>${done(s.n)?'✓ complete':'not yet'}</i></button>`).join('')}</div>
    <p style="margin-top:12px"><b>${nDone} of 10</b> stations complete. Complete a station by finishing its challenge.</p></div>
  <div class="card"><h3>Certificate</h3><p class="hint">Type your name and print a certificate of completion for this lab.</p>
    <div class="row"><input class="textin" id="cname" placeholder="Your name" style="flex:1;min-width:200px;min-height:0;padding:10px 14px" value="${esc(store.data.name||'')}"><button class="btn primary" id="cprint">Print certificate</button></div>
    <div class="cert" id="cert"><div class="cert-in"><p class="ck">Certificate of completion</p><h2 id="cn">${esc(store.data.name||'Your name')}</h2><p>has explored how an AI assistant works, from tokens to agent teams, in</p><p class="ct2">Inside the AI Helpdesk: an interactive LLM lab</p><p>${nDone} of 10 stations complete · ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</p>
      <div class="ctiles">${['Token','IDs','Predict','Embed','Prompt','Memory','RAG','Tools','Agent','Team'].map((x,i)=>`<span class="tile c${i%6} ${done(i+1)?'':'dim'}">${x}</span>`).join('')}</div></div></div></div>`;
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  $('#cname').oninput = e => { store.data.name=e.target.value.slice(0,60); store.save(); $('#cn').textContent = store.data.name || 'Your name'; };
  $('#cprint').onclick = () => { if(!store.data.name){ Narrator.say('Add your name first', ['Type it in the box, then print.']); return; } document.body.classList.add('printing-cert'); window.print(); setTimeout(()=>document.body.classList.remove('printing-cert'), 500); };
  Narrator.page('Real world: from this lab to real products', ['The table compares this lab with real assistants.', '<b>Your progress</b>: click a station to revisit it.', '<b>Certificate</b>: type your name and print.'], nDone===10?'All ten stations complete. Well done!':`${nDone} of 10 stations complete.`);
};

/* =========================================================
   Boot
   ========================================================= */
store.load();
const tm = $('#teacher');
tm.addEventListener('change', () => { document.documentElement.classList.toggle('teacher', tm.checked); requestAnimationFrame(movePacket); });
$('#resetProgress').onclick = () => { store.data={done:{},scores:{}}; store.save(); ch.i=0; ch.cuts=new Set(); ch.results=[]; ch.checked=false; renderRail(); go(current); Narrator.say('Progress reset',['All badges are cleared.']); };
window.addEventListener('resize', movePacket);
new MutationObserver(() => document.querySelectorAll('.wstrip').forEach(s => { if(!s._sc || s.scrollWidth!==s._sc){ s._sc=s.scrollWidth; s.scrollLeft=s.scrollWidth; } })).observe(document.getElementById('panel'), {childList:true, subtree:true});
renderRail();
go(1);
</script>
</body>
